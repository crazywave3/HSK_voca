<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HSK 플래시카드</title>
<style>
  @font-face {
    font-family: 'SimSun';
    src: url('https://raw.githubusercontent.com/crazywave3/HSK_voca/main/font_ZH/simsun.ttc') format('truetype');
    font-weight: normal;
  }
  @font-face {
    font-family: 'SimSun';
    src: url('https://raw.githubusercontent.com/crazywave3/HSK_voca/main/font_ZH/simsunb.ttf') format('truetype');
    font-weight: bold;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: #f5f5f0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 40px; color: #1a1a1a;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 20px; color: #111; }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab {
    padding: 8px 20px; border-radius: 20px; border: 1.5px solid #ddd;
    background: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; color: #666;
  }
  .tab:hover { border-color: #999; color: #333; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .progress-bar {
    width: 100%; max-width: 480px; height: 4px; background: #e0e0e0;
    border-radius: 2px; margin-bottom: 12px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: #1a1a1a; border-radius: 2px; transition: width 0.3s ease; }
  .progress-text { font-size: 13px; color: #888; margin-bottom: 24px; }
  .card-area { width: 100%; max-width: 480px; perspective: 1200px; margin-bottom: 28px; }
  .card-inner {
    position: relative; width: 100%; padding-top: 65%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
    padding: 24px;
  }
  .card-front {
    background: #1a1a1a; border: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
  }
  .card-back {
    background: #fff; border: 1.5px solid #e8e8e8;
    transform: rotateY(180deg);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    justify-content: space-between;
  }
  .hanzi-front { font-size: clamp(48px, 12vw, 88px); font-weight: 400; color: #fff; line-height: 1; font-family: 'SimSun', serif; }
  .hint { margin-top: 16px; font-size: 13px; color: #666; }
  .back-top {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; flex: 1; width: 100%;
  }
  .hanzi-back { font-size: clamp(36px, 9vw, 64px); font-weight: 400; color: #111; line-height: 1; margin-bottom: 12px; font-family: 'SimSun', serif; }
  .pinyin { font-size: clamp(16px, 4.5vw, 26px); color: #666; letter-spacing: 0.5px; }
  .divider { width: 100%; height: 1px; background: #e8e8e8; flex-shrink: 0; }
  .example {
    width: 100%; padding: 14px 4px 0;
    font-size: clamp(22px, 6vw, 27px); color: #444;
    line-height: 1.6; text-align: center; letter-spacing: 0.3px;
    flex-shrink: 0; cursor: pointer; font-family: 'SimSun', serif;
  }
  .nav-btns { display: flex; gap: 12px; width: 100%; max-width: 480px; }
  .btn {
    flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid #ddd;
    background: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; color: #333;
  }
  .btn:hover { background: #f0f0f0; border-color: #bbb; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn.primary:hover { background: #333; }
  .shuffle-btn {
    margin-top: 16px; padding: 10px 24px; border-radius: 20px;
    border: 1.5px solid #ddd; background: #fff; font-size: 13px;
    font-weight: 600; cursor: pointer; color: #666; transition: all 0.15s;
  }
  .shuffle-btn:hover { border-color: #999; color: #333; }
  .done-screen {
    display: none; flex-direction: column; align-items: center;
    gap: 16px; width: 100%; max-width: 480px; text-align: center;
  }
  .done-screen .big { font-size: 48px; }
  .done-screen h2 { font-size: 22px; font-weight: 700; }
  .done-screen p { font-size: 15px; color: #666; }

  .card-example-detail {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #fff; border: 1.5px solid #e8e8e8;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transform: rotateY(0deg);
    cursor: pointer;
  }
  .ex-sentence { font-size: clamp(20px, 5.5vw, 28px); color: #111; line-height: 1.5; text-align: center; font-family: 'SimSun', serif; margin-bottom: 10px; }
  .ex-pinyin   { font-size: clamp(14px, 3.5vw, 18px); color: #666; letter-spacing: 0.3px; text-align: center; margin-bottom: 10px; }
  .ex-korean   { font-size: clamp(15px, 4vw, 20px); color: #333; text-align: center; line-height: 1.5; }
  .card-inner.show-detail .card-front  { pointer-events: none; }
  .card-inner.show-detail .card-back   { pointer-events: none; }
  /* 앱 모드 탭 */
  .app-tabs {
    display: flex; gap: 0; margin-bottom: 28px;
    border-radius: 12px; overflow: hidden;
    border: 1.5px solid #ddd; background: #fff;
    width: 100%; max-width: 480px;
  }
  .app-tab {
    flex: 1; padding: 12px 16px; border: none; background: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    color: #888; transition: all 0.15s;
  }
  .app-tab:first-child { border-right: 1.5px solid #ddd; }
  .app-tab.active { background: #1a1a1a; color: #fff; }


  /* 독해 섹션 */
  .reading-box {
    width: 100%; background: #fff; border-radius: 16px;
    border: 1.5px solid #e8e8e8; padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 16px; min-height: 200px;
  }
  .reading-loading {
    text-align: center; color: #888; font-size: 15px; padding: 40px 0;
  }
  .reading-title {
    font-size: clamp(22px, 6vw, 27px); font-weight: 700; color: #1a1a1a;
    margin-bottom: 8px; text-align: center;
  }
  .reading-level {
    font-size: clamp(22px, 6vw, 27px); color: #888; text-align: center; margin-bottom: 18px;
  }
  .reading-text {
    font-size: clamp(22px, 6vw, 27px); line-height: 1.8; color: #222;
    font-family: 'SimSun', serif; word-break: break-all;
  }
  .reading-btns {
    display: flex; gap: 10px; justify-content: center; width: 100%;
  }
  /* 듣기연습 섹션 */
  #listeningSection { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }
  .listen-level-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .listen-level-tabs .tab { padding: 8px 20px; border-radius: 20px; border: 1.5px solid #ddd; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; color: #666; }
  .listen-level-tabs .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .listen-level-tabs .tab:hover { border-color: #999; color: #333; }
  .file-list { width: 100%; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
  .file-item {
    padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid #ddd; background: #fff;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all 0.15s; color: #333; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .file-item:hover { border-color: #999; background: #f9f9f9; }
  .file-item.active { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
  .file-item .file-icon { font-size: 18px; flex-shrink: 0; }
  .file-item .file-name { flex: 1; word-break: break-all; }
  .player-box {
    width: 100%; background: #fff; border-radius: 16px;
    border: 1.5px solid #e8e8e8; padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .player-title {
    font-size: 14px; font-weight: 600; color: #333;
    margin-bottom: 16px; word-break: break-all; line-height: 1.4;
  }
  .player-progress { width: 100%; margin-bottom: 10px; }
  .player-bar-wrap {
    width: 100%; height: 20px; background: #e8e8e8;
    border-radius: 0; cursor: pointer; margin-bottom: 6px;
    position: relative; user-select: none;
  }
  .player-bar-fill {
    height: 100%; background: #1a1a1a; border-radius: 0;
    transition: width 0.1s; pointer-events: none;
  }
  .player-time {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #888;
  }
  .player-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-top: 16px;
  }
  .ctrl-btn {
    padding: 10px 16px; border-radius: 10px; border: 1.5px solid #ddd;
    background: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; color: #333; transition: all 0.15s;
  }
  .ctrl-btn:hover { background: #f0f0f0; }
  .ctrl-btn.play {
    background: #1a1a1a; color: #fff; border-color: #1a1a1a;
    padding: 10px 24px; font-size: 15px;
  }
  .ctrl-btn.play:hover { background: #333; }
  .no-files { text-align: center; color: #888; font-size: 14px; padding: 40px 0; }
  @media (max-width: 480px) {

    body { padding: 16px 12px 32px; }
    .tab { padding: 7px 15px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app-tabs">
  <button class="app-tab active" onclick="switchApp('flashcard', this)">단어 카드</button>
  <button class="app-tab" onclick="switchApp('listening', this)">듣기 연습</button>
  <button class="app-tab" onclick="switchApp('reading', this)">독해 연습</button>
</div>
<div class="tabs" id="levelTabs">
  <button class="tab" data-level="hsk1" onclick="setLevel('hsk1', this)">HSK 1급</button>
  <button class="tab" data-level="hsk2" onclick="setLevel('hsk2', this)">HSK 2급</button>
  <button class="tab active" data-level="hsk3" onclick="setLevel('hsk3', this)">HSK 3급</button>
</div>
<div class="tabs" id="listenTabs" style="display:none;">
  <button class="tab" data-level="hsk1" onclick="setListenLevel('hsk1', this)">HSK 1급</button>
  <button class="tab" data-level="hsk2" onclick="setListenLevel('hsk2', this)">HSK 2급</button>
  <button class="tab active" data-level="hsk3" onclick="setListenLevel('hsk3', this)">HSK 3급</button>
</div>
<!-- 독해 섹션 -->
<div id="readingSection" style="display:none; width:100%; max-width:480px; flex-direction:column; align-items:center;">
  <div class="reading-box" id="readingBox">
    <div class="reading-loading" id="readingLoading" style="display:none;">지문 생성 중...</div>
    <div class="reading-content" id="readingContent"></div>
  </div>
  <div class="reading-btns">
    <button class="ctrl-btn" id="readingPrevBtn" onclick="readingPrev()" disabled>◀ 이전</button>
    <button class="ctrl-btn play" onclick="generateReading()">새 지문 생성</button>
    <button class="ctrl-btn" id="readingNextBtn" onclick="readingNext()" disabled>다음 ▶</button>
  </div>
</div>
<!-- 듣기연습 섹션 -->
<div id="listeningSection" style="display:none;">
  <div class="file-list" id="fileList">
    <div class="no-files">파일을 불러오는 중...</div>
  </div>
  <div class="player-box" id="playerBox" style="display:none;">
    <div class="player-title" id="playerTitle"></div>
    <div class="player-progress">
      <div class="player-bar-wrap" id="playerBarWrap" onclick="seekAudio(event)">
        <div class="player-bar-fill" id="playerBarFill" style="width:0%"></div>
      </div>
      <div class="player-time">
        <span id="playerCurrent">0:00</span>
        <span id="playerDuration">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" onclick="skipAudio(-3)">◀◀ 3초</button>
      <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶ 재생</button>
      <button class="ctrl-btn" onclick="skipAudio(3)">3초 ▶▶</button>
    </div>
  </div>
</div>
<!-- 플래시카드 섹션 -->
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText"></div>
<div class="card-area" id="cardArea">
  <div class="card-inner" id="cardInner" onclick="handleCardClick()">
    <div class="card-face card-front">
      <div class="hanzi-front" id="cardFront"></div>
      <div class="hint">터치하면 뒤집기</div>
    </div>
    <div class="card-face card-back">
      <div class="back-top">
        <div class="hanzi-back" id="cardBackHanzi"></div>
        <div class="pinyin" id="cardBackPinyin"></div>
      </div>
      <div class="divider"></div>
      <div class="example" id="cardExample" onclick="copyExample(event)"></div>
    </div>
  </div>
  <div class="card-example-detail" id="cardDetail" style="display:none;" onclick="handleDetailClick()">
    <div class="ex-sentence" id="detailSentence"></div>
    <div class="ex-pinyin"   id="detailPinyin"></div>
    <div class="ex-korean"   id="detailKorean"></div>
  </div>
</div>
<div class="nav-btns">
  <button class="btn" onclick="prevCard()">← 이전</button>
  <button class="btn primary" onclick="nextCard()">다음 →</button>
</div>
<button class="shuffle-btn" onclick="shuffleCards()">🔀 섞기</button>
<div class="done-screen" id="doneScreen">
  <div class="big">🎉</div>
  <h2>완료!</h2>
  <p id="doneText"></p>
  <button class="btn primary" style="max-width:200px" onclick="restart()">처음부터</button>
</div>

let level = 'hsk1', deck = [], idx = 0;
let isShuffled = false;

let cardState = 0; // 0=앞면, 1=뒷면, 2=예문상세
let currentExIdx = 0;

function parsePinyin(back) {
  const m = back.match(/\[(.+)\]$/);
  return m ? m[1] : '';
}

function handleCardClick() {
  if (cardState === 0) {
    // 1→2: 앞면에서 뒷면으로 (3D 플립)
    cardState = 1;
    document.getElementById('cardInner').classList.add('flipped');
  } else if (cardState === 1) {
    // 2→3: 뒷면에서 예문상세로 (애니메이션 없이 즉시)
    cardState = 2;
    const card = deck[idx];
    const ex = card.examples[currentExIdx];
    document.getElementById('detailSentence').textContent = ex.sentence;
    document.getElementById('detailPinyin').textContent   = ex.pinyin;
    document.getElementById('detailKorean').textContent   = ex.korean;
    // 카드 즉시 숨기고 상세 표시
    document.getElementById('cardInner').style.visibility = 'hidden';
    document.getElementById('cardDetail').style.display   = 'flex';
    document.getElementById('cardDetail').style.position  = 'absolute';
    document.getElementById('cardDetail').style.inset     = '0';
  }
}

function handleDetailClick() {
  // 3→1: 예문상세에서 다시 앞면으로 (애니메이션 없이 즉시)
  cardState = 0;
  const inner = document.getElementById('cardInner');
  inner.style.transition = 'none';
  inner.classList.remove('flipped');
  inner.style.visibility = 'visible';
  document.getElementById('cardDetail').style.display = 'none';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { inner.style.transition = ''; });
  });
}

const PASSAGES = [{"title": "我的家", "level": "阅读短文（小学三四年级）", "text": "我家有四口人，爸爸、妈妈、姐姐和我。我们住在一栋红色的楼房里，家里有客厅、厨房和两间卧室。\n客厅里有一张大沙发和一台电视机。我最喜欢坐在沙发上看动画片。厨房里总是飘来好闻的香味，那是妈妈在做饭。\n我的房间不大，但是很整洁。书桌上放着我的书包和课本。墙上贴着我画的图画。我很爱我的家，它是我最温暖的地方。"}, {"title": "我的学校", "level": "阅读短文（小学三四年级）", "text": "我的学校叫光明小学，离我家不远，走路只要十分钟。学校里有一个大操场，同学们每天早上在操场上做操。\n教学楼一共有四层，我们班在二楼。教室里有黑板、讲台和很多课桌椅。老师在黑板上写字，我们认真地听讲。\n学校里还有图书室和美术室。我最喜欢去图书室，那里有很多有趣的书。每次去图书室，我都不想离开。我喜欢我的学校。"}, {"title": "我的好朋友", "level": "阅读短文（小学三四年级）", "text": "我有一个好朋友，他叫小明。我们是同班同学，也是邻居。每天早上，我们一起走路上学。\n小明很聪明，学习很好。他特别喜欢数学，每次考试都能得满分。我有不会的题目，他总是耐心地帮我讲解。\n放学后，我们经常在一起玩。我们喜欢踢足球和下棋。有时候我赢，有时候他赢，但我们从不吵架。真正的好朋友就是这样，在一起很开心，分开了也会想念对方。"}, {"title": "快乐的周末", "level": "阅读短文（小学三四年级）", "text": "星期六早上，我七点就起床了。吃完早饭，爸爸说今天带我们去公园玩，我高兴得跳了起来。\n公园里人很多，到处都是花和树。我们先去看了小动物，有兔子、小鸟和金鱼。然后爸爸陪我放风筝，风筝飞得很高，像一只鸟在天空中飞翔。\n中午我们在公园的小餐厅吃饭。下午，妈妈带我去书店，我挑了两本喜欢的书。晚上回到家，我把今天的事情写在日记里。这个周末真开心！"}, {"title": "我喜欢的小动物", "level": "阅读短文（小学三四年级）", "text": "我家养了一只小猫，名字叫花花。它全身白色，只有耳朵和尾巴是橙色的，非常漂亮。\n花花很喜欢玩。我用线团逗它玩，它会用爪子去抓，样子十分可爱。它还喜欢跳上跳下，有时候跳到书桌上，把我的铅笔碰掉。\n每天放学回家，花花都会跑过来迎接我，在我脚边蹭来蹭去。我喂它吃鱼，它吃得很香。晚上睡觉，花花有时候会跳上我的床，趴在我脚边。我非常喜欢花花。"}, {"title": "美丽的春天", "level": "阅读短文（小学三四年级）", "text": "春天来了，天气慢慢变暖了。柳树发出了嫩绿的新芽，像一根根细细的辫子垂下来。桃花开了，粉红色的花朵挂满了枝头，美极了。\n草地上的小草也绿了。蜜蜂和蝴蝶在花丛中飞来飞去，忙着采蜜。小鸟站在树枝上唱歌，声音清脆好听。\n我和同学们在操场上放风筝。风筝飞得高高的，在蓝天上飘来飘去。春天的风轻轻地吹过，让人感觉很舒服。我喜欢春天，它让大地变得生机勃勃。"}, {"title": "夏天的乐趣", "level": "阅读短文（小学三四年级）", "text": "夏天到了，天气变得很热。太阳高高地挂在天空中，晒得地面都烫脚。\n不过夏天也有很多乐趣。放学后，我和小伙伴们在小区里玩水，用水枪互相喷，弄得全身湿透，但是大家都笑得很开心。\n晚上，全家人坐在院子里乘凉。爷爷给我讲故事，奶奶给我扇扇子。天上的星星亮晶晶的，我数啊数，怎么也数不完。爸爸说那是银河，里面有数不清的星星。夏天的夜晚真美。"}, {"title": "金色的秋天", "level": "阅读短文（小学三四年级）", "text": "秋天到了，树叶变黄了，有的变成了红色，从树上一片一片地飘落下来，像一只只蝴蝶在飞舞。\n果园里，苹果红了，梨子黄了，葡萄紫了，到处都是丰收的气息。农民伯伯们忙着摘果子，脸上挂着笑容。\n我和爸爸去郊外捡落叶。我捡了好多形状各异的叶子，有枫叶、银杏叶。回家后，我把叶子夹在书里，做成了漂亮的书签送给老师。秋天是个美丽的季节，也是收获的季节。"}, {"title": "下雪了", "level": "阅读短文（小学三四年级）", "text": "冬天的一个早晨，我推开窗户，发现外面全白了。下雪了！地上、屋顶上、树枝上都盖着厚厚的白雪，像铺了一层白色的毯子。\n吃完早饭，我穿上厚厚的棉衣跑到院子里。我和小伙伴们堆雪人，用石子做眼睛，用红萝卜做鼻子，还给雪人戴上帽子和围巾，雪人看起来很神气。\n我们还打雪仗，互相扔雪球。大家笑啊叫啊，玩得不亦乐乎。虽然手冻得红红的，但是心里很暖和。冬天因为有雪，变得格外好玩。"}, {"title": "我的房间", "level": "阅读短文（小学三四年级）", "text": "我有一个属于自己的小房间。房间里有一张床、一张书桌和一个书架。床上铺着我最喜欢的蓝色被子，上面印着小星星的图案。\n书架上放满了书，有童话故事、科学百科，还有漫画书。我最喜欢的是那套《十万个为什么》，里面有很多有趣的知识。\n书桌旁边的墙上，挂着我自己画的画和获得的奖状。每次看到奖状，我就觉得很自豪。我的房间虽然不大，但是整洁温馨，是我学习和休息的好地方。"}, {"title": "帮妈妈做家务", "level": "阅读短文（小学三四年级）", "text": "星期天，妈妈要打扫房间，我说我来帮忙。妈妈很高兴，说：好啊，你真是妈妈的好帮手。\n我先用抹布把桌子擦干净，再把地上的东西整理好。妈妈拖地的时候，我把椅子搬开，让妈妈拖完再放回去。\n我们一起干活，不到一个小时，房间就变得干干净净。妈妈摸着我的头说：你长大了，知道帮妈妈做事了，妈妈真高兴。我心里美滋滋的，原来帮助别人是这么快乐的事情。"}, {"title": "图书馆里的故事", "level": "阅读短文（小学三四年级）", "text": "我最喜欢去图书馆。图书馆里有很多书，排列整齐，看上去非常壮观。我每周都要去两次，每次都待很长时间。\n上周，我在图书馆发现了一本讲宇宙的书。书里说宇宙有数不清的星星，地球只是其中一个小小的行星。我看得入了迷，忘了时间，妈妈来接我，我才依依不舍地离开。\n图书馆里要保持安静，大家都轻声说话，认真读书。在那里，每个人都沉浸在书的世界里。我觉得图书馆是个神奇的地方，里面藏着无穷无尽的知识。"}, {"title": "我的爸爸", "level": "阅读短文（小学三四年级）", "text": "我的爸爸是一名工程师，每天很早出门，很晚回家。虽然他很忙，但是周末一定会陪我玩。\n爸爸会做很多事情。他会修理家里坏掉的东西，还会做好吃的饭菜。每次他做红烧肉，我都要多吃一碗饭。\n最让我感动的是，每次我遇到困难，爸爸总是第一个帮我想办法。他告诉我，遇到问题不要怕，要动脑筋想办法解决。爸爸是我心目中最伟大的人，我长大了也要像他一样努力工作。"}, {"title": "我的妈妈", "level": "阅读短文（小学三四年级）", "text": "我的妈妈是一位小学老师，她教语文课。妈妈工作很认真，学生们都很喜欢她。\n在家里，妈妈每天给我们做饭，洗衣服，把家里收拾得干干净净。她很辛苦，但是从不抱怨。\n妈妈对我的学习很关心。每天晚上，她都会检查我的作业，帮我复习功课。如果我考试进步了，她会表扬我；如果我退步了，她会帮我找出原因，鼓励我继续努力。妈妈说：只要认真，就一定能学好。我爱我的妈妈。"}, {"title": "种豆子", "level": "阅读短文（小学三四年级）", "text": "科学老师让我们回家种豆子，观察它发芽的过程。我找来一个小花盆，装上泥土，然后把几颗豆子埋进去，浇上水。\n第一天，什么也没有。第二天还是没有。第三天，我看到泥土上出现了一点点绿色，是豆芽冒出来了！我高兴得叫起来，把妈妈也叫来看。\n每天我都给豆芽浇水，看着它一点点长大。一周后，豆苗已经长出了两片叶子。我把这个过程画成图，写成观察日记，带去学校给老师看。老师说我观察得很仔细，给了我一个大大的表扬。"}, {"title": "生日快乐", "level": "阅读短文（小学三四年级）", "text": "今天是我八岁生日。早上起来，妈妈已经在桌上放了一个大蛋糕，上面有八根蜡烛，还用奶油写着生日快乐四个字。\n下午，我把几个好朋友请到家里来。大家一起玩游戏，讲笑话，笑声不断。妈妈做了很多好吃的，有炸鸡、水果沙拉和果汁。\n到了晚上，我许下愿望，吹灭蜡烛，切蛋糕。朋友们齐声唱起生日歌，那首歌是我听过的最好听的音乐。我许的愿望是：好好学习，天天向上，让爸爸妈妈为我骄傲。"}, {"title": "春节", "level": "阅读短文（小学三四年级）", "text": "春节是中国最重要的节日。每到春节，家家户户都要贴春联、挂灯笼、放鞭炮，热闹极了。\n除夕夜，全家人坐在一起吃年夜饭。桌上有鱼、有肉、有饺子，每道菜都有美好的寓意。爷爷说吃鱼是年年有余，饺子代表招财进宝。\n饭后，爷爷奶奶给我压岁钱，装在红色的信封里，叫红包。我非常高兴，把压岁钱放进存钱罐，准备用来买书。春节里，家人团聚，温暖又幸福。"}, {"title": "踢足球", "level": "阅读短文（小学三四年级）", "text": "我非常喜欢踢足球。每到课间操，我都和班里的男同学去操场踢球。我们分成两队，一队五个人，开始比赛。\n我是前锋，负责进攻。有一次，我得到一个绝好的机会，一脚射门，球飞速钻进球网，我们队得分了！队友们都跑来和我击掌庆贺，我高兴得跳了起来。\n踢足球不仅好玩，还能锻炼身体，让我们跑得更快，身体更健康。老师说，爱运动的孩子不容易生病，还能让大脑更聪明。我要坚持踢球，成为出色的球员。"}, {"title": "画画", "level": "阅读短文（小学三四年级）", "text": "我喜欢画画，这是我最大的爱好。每个周末，我都会拿出彩色铅笔和画纸，画我喜欢的东西。\n有时候我画大海，蓝色的海水里有小鱼和海草；有时候我画森林，高大的树木中间有松鼠和小鸟；有时候我画我的家人，虽然画得不太像，但是妈妈总说画得很好。\n美术课上，老师教我们用水彩画风景。我把颜料一点一点地涂上去，画出了一幅美丽的日落图。老师把我的画贴在教室墙上展示，我骄傲极了。画画让我的生活更加丰富多彩。"}, {"title": "我的老师", "level": "阅读短文（小学三四年级）", "text": "我们班的语文老师姓王，我们都叫她王老师。王老师三十多岁，梳着短发，戴着眼镜，说话温柔，笑起来很好看。\n王老师上课很生动。她讲故事的时候，我们都听得入迷，经常忘了时间。她教我们写作文的方法，告诉我们怎么把看到的、想到的、感受到的用文字表达出来。\n王老师对我们很关心。有一次我发烧没去上课，王老师专门打电话给妈妈询问我的情况，还让同学把作业帮我带来。我觉得有这么好的老师很幸福，我要认真学习，不辜负老师的期望。"}, {"title": "骑自行车", "level": "阅读短文（小学三四年级）", "text": "我学骑自行车的时候，摔了好多次。爸爸扶着后座帮我练习，但是有时候他一松手，我就倒下去，膝盖擦破了皮，疼得我想哭。\n爸爸鼓励我说：没关系，跌倒了再爬起来，多练几次就会了。我擦干眼泪，继续练。一次次摔倒，又一次次爬起来，渐渐地，我能骑出几米远了，然后是十几米，最后我可以绕着院子骑一大圈了！\n那天我骑着车，风迎面吹来，我高兴地大喊：我会骑车了！爸爸站在旁边，开心地鼓掌。那一刻，我明白了一个道理：坚持努力，终会成功。"}, {"title": "游泳", "level": "阅读短文（小学三四年级）", "text": "暑假里，爸爸给我报了游泳班。第一次下水，我非常害怕，紧紧抓住池边，不敢松手。教练走过来，轻声对我说：不要怕，我在旁边，不会让你沉下去的。\n在教练的帮助下，我慢慢学会了打水，然后学会了换气。刚开始喝了几口水，呛得直咳嗽，但是我没有放弃。\n两周后，我能在水里游十几米了。教练夸我进步很快，这让我更有信心。暑假结束，我已经能游五十米了。爸爸说，游泳是一项受用一生的技能，我很庆幸自己坚持下来，学会了游泳。"}, {"title": "我的梦想", "level": "阅读短文（小学三四年级）", "text": "我的梦想是成为一名医生。爷爷生病住院的时候，我看到医生和护士每天认真地为病人治病，心里非常佩服。\n医生要学很多知识，不仅要懂得如何诊断疾病，还要关心每一位病人，让他们感到安慰和希望。我觉得，能帮助生病的人恢复健康，是世界上最有意义的工作。\n为了实现这个梦想，我现在要认真学习，打好知识基础。爸爸说，只要有梦想并且努力去实现，梦想终会成真。我相信，只要我持之以恒，有一天我一定能穿上白大褂，成为一名救死扶伤的医生。"}, {"title": "中秋节", "level": "阅读短文（小学三四年级）", "text": "中秋节是农历八月十五，这一天月亮最圆最亮。我们家有赏月的习惯，每年中秋节晚上，全家人都会坐在院子里，一边吃月饼一边赏月。\n今年中秋节，奶奶准备了好多月饼，有莲蓉的、豆沙的、蛋黄的，还有五仁的。我最喜欢蛋黄月饼，又香又甜。\n爷爷给我讲了嫦娥奔月的故事。他说月亮里住着嫦娥和玉兔，嫦娥非常思念人间。我仰望着又圆又亮的月亮，感觉月亮真的离我很近。中秋节是团圆的节日，家人在一起，就是最幸福的事。"}, {"title": "第一次做饭", "level": "阅读短文（小学三四年级）", "text": "妈妈不在家的一天，我决定自己做饭。我打开冰箱，找到了鸡蛋和西红柿，决定做一道西红柿炒鸡蛋。\n我先把西红柿切成小块，再把鸡蛋打在碗里搅匀。锅热了之后，我倒入油，炒鸡蛋，再放西红柿翻炒，加盐调味。锅里发出滋滋的声音，香味四溢。\n等妈妈回家，看到桌上的饭菜，先是惊讶，然后尝了一口，说：真好吃！我骄傲极了。虽然菜的样子不太好看，但是自己做的，感觉特别有意义。从那以后，我爱上了做饭这件事。"}, {"title": "运动的好处", "level": "阅读短文（小学三四年级）", "text": "我每天早上都会跑步二十分钟。开始时，跑两圈就气喘吁吁，腿也酸了。但是坚持了一个月之后，我能轻松跑五圈了。\n体育老师说，经常运动有很多好处。运动能让我们的身体更健康，心肺功能更强；还能让我们睡得更好，第二天精神饱满；更重要的是，运动能让大脑更活跃，帮助我们学习。\n自从我坚持跑步，上课时注意力更集中了，成绩也提高了不少。爸爸妈妈看到我的变化，都很高兴。我要一直坚持运动，做一个健康快乐的孩子。"}, {"title": "做饺子", "level": "阅读短文（小学三四年级）", "text": "冬至那天，妈妈说要包饺子。我说我也要学，妈妈高兴地答应了，还特意给我擀了几张小饺子皮。\n妈妈教我先把馅料放在饺子皮中间，然后对折，捏紧边缘。我捏出来的饺子歪歪扭扭的，不太好看，但是妈妈说第一次能包成这样就不错了。\n饺子下锅煮熟后，妈妈把我包的饺子挑出来，让我先吃。吃着自己包的饺子，虽然样子不好看，但是感觉格外香甜。妈妈说，做什么事情都是先学后精，只要坚持，我一定能包出漂亮的饺子。"}, {"title": "小河边", "level": "阅读短文（小学三四年级）", "text": "我老家门前有一条小河。小河的水清澈透明，可以看到河底的石头和水草。每到夏天，小河就成了我们最快乐的地方。\n河里有很多小鱼，一群一群地游来游去。我和小伙伴们用网兜捞鱼，小鱼总是滑溜溜地逃走，捞到的机会不多，但大家还是捞得很起劲。\n河边的柳树把长长的枝条垂到水面，像一位姑娘在梳头。我们有时候爬上岸边的大石头，把脚泡在水里，凉凉的，好舒服。小河边的夏天，是我童年最美好的记忆。"}, {"title": "第一次坐飞机", "level": "阅读短文（小学三四年级）", "text": "暑假里，爸爸带我坐飞机去北京。这是我第一次坐飞机，心里又兴奋又紧张。\n到了机场，我看见那么大的飞机，震惊极了。登机后，我坐在靠窗的位子上，把脸贴近玻璃往外看。飞机滑行、加速，然后猛地冲上天空，我感觉身体被压进座位里，既害怕又刺激。\n等飞机平稳之后，我往窗外看，只见蓝天白云，地面上的楼房和汽车变得像玩具一样小。真是太神奇了！我拿出笔，把这次经历写下来，打算回去写成一篇作文，与同学们分享。"}, {"title": "看望生病的同学", "level": "阅读短文（小学三四年级）", "text": "班里的小强感冒发烧，已经三天没来上课了。班主任李老师说，我们去看望他。放学后，我和两个同学买了一些水果，来到小强家。\n小强看见我们，脸上立刻有了笑容。他说在家一个人待着很无聊，很想来上课。我们把老师布置的作业带给他，还告诉他课上发生的有趣的事，小强听得咯咯直笑。\n临走时，小强握着我们的手说：谢谢你们来看我，有你们这样的好朋友，我觉得好幸福。我们也很开心，帮助朋友的感觉真好。朋友之间，不只是一起玩，也要在对方最需要的时候出现。"}, {"title": "奶奶的菜园", "level": "阅读短文（小学三四年级）", "text": "奶奶家院子里有一块小菜园，种着各种蔬菜。春天种茄子、辣椒和西红柿，夏天种黄瓜和豆角，秋天种大白菜和萝卜。一年四季，菜园里总有绿色。\n奶奶每天早晨都去菜园浇水除草，把菜照顾得很好。夏天，黄瓜长得又长又绿，西红柿红彤彤的挂在藤上，看着就让人口水直流。\n我最喜欢帮奶奶摘菜。走进菜园，扒开叶子，找到藏在里面的黄瓜，摘下来直接啃，清脆多汁，好吃极了。自己种的菜，比买的更好吃，可能因为里面有劳动的味道。"}, {"title": "放学路上", "level": "阅读短文（小学三四年级）", "text": "放学铃声一响，我背上书包走出教室。校门口，家长们早已等候，孩子们一个个找到自己的爸爸妈妈，牵手离去。\n我是和小明一起走路回家的，我们住在同一个小区。放学路上，我们有说不完的话，聊今天的课、老师讲的故事、好笑的事情。不知不觉，已经走到了小区门口。\n妈妈在家里等着我，看见我回来，问我今天过得怎么样，有没有好好吃午饭。我把今天的事情一一说给她听，妈妈认真地听，时不时点头。这条放学路，因为有好朋友和温暖的家，变得特别美好。"}, {"title": "我的同学们", "level": "阅读短文（小学三四年级）", "text": "我们班有四十二个同学，男生女生各一半。大家来自不同的家庭，有着各自的爱好和特长。\n小军是我们班的数学高手，做题很快，几乎次次满分。小花喜欢画画，黑板报总是由她来布置，画得漂亮极了。小伟是体育明星，跑步跳高样样厉害，运动会上总是拿奖。\n虽然我们各有不同，但是大家在一起很团结。遇到困难互相帮助，有好东西一起分享。班主任老师说我们班是个温暖的大家庭，我深有同感。能与这些同学一起学习、成长，是我很幸运的事情。"}, {"title": "捡垃圾", "level": "阅读短文（小学三四年级）", "text": "周末，学校组织我们去公园参加义务劳动，帮助清洁公园的环境。我们每人戴上手套，拿着垃圾袋，分散开来捡垃圾。\n公园里的垃圾还真不少，草丛里有饮料瓶，长椅下面有糖纸，花坛边有塑料袋。我埋头仔细地捡，不一会儿，袋子就装了大半。\n两个小时后，公园变得干净多了。大家把垃圾袋集中起来，整整装了十几袋。望着整洁的公园，我们都很有成就感。老师说，保护环境是每个人的责任，要从小事做起，从自己做起。我下定决心，以后再也不乱扔垃圾了。"}, {"title": "我爱读课外书", "level": "阅读短文（小学三四年级）", "text": "除了课本，我还喜欢读很多课外书。妈妈每个月都会带我去书店，让我自己选两本喜欢的书。\n最近我迷上了《昆虫记》。书里描写了蜜蜂、蚂蚁、蝉等各种昆虫的生活习性，读起来像看故事一样有趣。我才知道，原来小小的蚂蚁那么聪明，能找到几百米外的食物；蜜蜂采蜜要飞很多公里，非常辛苦。\n读了《昆虫记》，我对大自然充满了好奇心。我在作文课上写了《小蚂蚁》这篇文章，老师给了很高的评价。多读书真的能让人进步，我要继续多看课外书。"}, {"title": "保护环境", "level": "阅读短文（小学五六年级）", "text": "地球是我们共同的家园，保护环境是每个人的责任。然而，随着工业发展和人口增加，环境污染问题越来越严重。工厂排放的废气让空气变脏，污水流入河流使水质变差，随意丢弃的垃圾污染了土地。\n作为小学生，我们虽然力量有限，但也可以从小事做起。节约用水，随手关灯，不使用一次性筷子，出行尽量选择步行或骑车，将垃圾分类投放……这些看似微小的行动，积累起来会产生巨大的力量。\n我们的地球只有一个。如果不好好保护，未来的子孙将生活在一个肮脏破败的星球上。所以，保护环境不能等待，要从现在做起，从自己做起，让地球永远美丽。"}, {"title": "节约用水", "level": "阅读短文（小学五六年级）", "text": "水是生命之源。地球上虽然有大量的水，但适合人类饮用的淡水资源非常有限。随着全球气候变化和人口增长，水资源短缺已成为世界性问题。\n在日常生活中，我们有很多浪费水的行为：洗手时不关水龙头，洗澡时间过长，用水管冲洗院子而不用水桶……这些习惯看似无关紧要，但日积月累，浪费的水量十分惊人。\n节约用水，我们可以做到：刷牙时关闭水龙头，洗菜的水用来浇花，发现漏水及时修理。每人每天节约一升水，全球数十亿人加在一起，就是一个巨大的数字。保护水资源，从节约每一滴水开始。"}, {"title": "爱护动物", "level": "阅读短文（小学五六年级）", "text": "地球上生活着数百万种动物，它们是我们人类共同的伙伴。然而由于人类的猎杀、栖息地破坏和环境污染，每年都有物种走向灭绝。大熊猫、东北虎、华南虎……这些珍稀动物的数量已经少得令人担忧。\n动物是生态链的重要组成部分。每一个物种的消失，都会影响整个生态系统的平衡，最终也会危害到人类自身。\n保护动物，就是保护我们自己的家园。我们要反对猎杀野生动物，不购买野生动物制品，支持自然保护区的建设。让每一种动物都能在地球上继续生存，是我们这一代人的责任。"}, {"title": "垃圾分类", "level": "阅读短文（小学五六年级）", "text": "垃圾分类是当今社会非常重要的环保行动。我们每天产生大量垃圾，如果不加以分类，这些垃圾混在一起，既难以处理，又会严重污染环境。\n一般来说，垃圾分为四类：可回收垃圾、厨余垃圾、有害垃圾和其他垃圾。废纸、塑料瓶、金属罐可以回收再利用；食物残渣是厨余垃圾，可以堆肥；废电池、过期药品是有害垃圾，要特别处理。\n垃圾分类能减少垃圾总量，提高资源利用率，减少环境污染。养成垃圾分类的习惯，虽然需要一定时间，但每个人都能做到，而且做到了就是在为地球做贡献。"}, {"title": "勤奋学习", "level": "阅读短文（小学五六年级）", "text": "古人云：书山有路勤为径，学海无涯苦作舟。勤奋是通向成功的唯一道路，没有任何捷径可走。\n历史上无数伟大的人物，无不是靠勤奋成就了辉煌的事业。爱迪生发明电灯，经历了数千次失败；居里夫人发现镭元素，在简陋的实验室里工作了数年。他们的成功，背后是无数个日夜的勤奋与坚持。\n对于我们学生来说，勤奋意味着认真上课，按时完成作业，主动预习复习，不懂就问。只有勤奋，才能真正掌握知识，打好基础，为未来做好准备。"}, {"title": "中国传统节日", "level": "阅读短文（小学五六年级）", "text": "中国有着悠久的历史和丰富的传统文化，传统节日是其中最具代表性的部分。春节、元宵节、清明节、端午节、中秋节、重阳节……这些节日承载着中华民族几千年的文化记忆。\n每个传统节日都有其独特的习俗和寓意。春节是新年，象征着辞旧迎新；端午节吃粽子、赛龙舟，纪念爱国诗人屈原；中秋节赏月吃月饼，寄托对亲人的思念；重阳节登高望远，表达对老人的敬爱。\n我们应当了解和珍视这些传统节日，因为它们是中华文化的根，是连接过去与未来的纽带。传承节日文化，就是传承民族精神。"}, {"title": "四大发明", "level": "阅读短文（小学五六年级）", "text": "中国古代有四大发明：造纸术、印刷术、火药和指南针。这四项发明对世界文明的发展产生了深远的影响，是中华民族对人类文明的巨大贡献。\n造纸术使书写材料变得廉价易得，推动了文化传播。印刷术大大降低了书籍的制作成本，让知识得以广泛传播。火药传入欧洲改变了战争方式。指南针用于航海，帮助欧洲人开启了大航海时代。\n这四大发明不仅改变了中国，也改变了整个世界的历史进程。我们应当为祖先的智慧感到自豪，同时也应当努力学习，为今天的科技创新贡献自己的力量。"}, {"title": "科技改变生活", "level": "阅读短文（小学五六年级）", "text": "科学技术的飞速发展，彻底改变了人们的生产和生活方式。百年前，人们写信要等几周甚至几个月才能收到回信；今天，一条消息几秒钟就能传遍全球。这种变化，令人惊叹。\n互联网的普及让信息的获取变得无比便捷；智能手机让通讯、购物、娱乐都集中在一块屏幕上；高速铁路让数百公里的距离缩短到一两个小时……科技让生活更快捷、更方便、更舒适。\n当然，科技也带来了一些问题，比如过度依赖手机、网络安全威胁等。科技是工具，关键在于如何使用。我们应当合理利用科技，让它为我们的生活和学习服务。"}, {"title": "读书的重要性", "level": "阅读短文（小学五六年级）", "text": "读书破万卷，下笔如有神。古人早就认识到读书的重要性。阅读是获取知识、开阔眼界最直接的途径。\n读书能让我们了解不同的世界和文化。通过阅读，我们可以跟随探险家走过未知的大陆，和科学家一起探索宇宙的奥秘，聆听历史上伟大人物的故事。书本是我们打开世界大门的钥匙。\n读书还能培养我们的思维能力、语言表达能力和情感理解能力。爱读书的孩子通常思维活跃，表达清晰，理解力强。在信息时代，养成读书的习惯，是给自己最好的礼物。"}, {"title": "体育锻炼的好处", "level": "阅读短文（小学五六年级）", "text": "生命在于运动。这句话说明了体育锻炼对人体健康的重要性。规律的体育锻炼不仅强健体魄，更能带来全面的益处。\n首先，运动能增强心肺功能，提高身体免疫力，让我们不容易生病。其次，运动时大脑会分泌让人快乐的物质，有助于缓解压力和焦虑，保持心情愉快。研究还发现，运动能促进大脑发育，提高记忆力和注意力，对学习大有裨益。\n对于中小学生来说，每天保持一定量的体育锻炼至关重要。体育锻炼不仅让我们拥有健康的身体，还能培养坚持、拼搏、团队合作等优秀品质，让我们受益终身。"}, {"title": "感恩父母", "level": "阅读短文（小学五六年级）", "text": "世间最无私的爱，是父母对子女的爱。从我们出生那一刻起，父母就把全部的心思都放在我们身上，日夜操劳，不求任何回报。\n回想从小到大，父母为我们付出了多少：深夜陪我们发烧，风雨中接送我们上学，省吃俭用供我们读书……这一切，都是爱的表达。然而，很多时候我们觉得这一切是理所当然的，从未想过要感谢。\n感恩父母，不需要等到长大。现在，我们就可以从小事做起：帮父母做家务、认真学习让他们放心、主动和他们说说心里话……父母不需要什么大礼，你的用心就是他们最大的幸福。"}, {"title": "感谢老师", "level": "阅读短文（小学五六年级）", "text": "古人说：一日为师，终身为父。老师在我们的成长道路上，扮演着无可替代的角色。他们不仅传授知识，更以言行影响着我们的价值观和人生观。\n老师的工作是辛苦的。备课、上课、批改作业、与家长沟通……每一天都在默默付出。他们或许没有丰厚的收入，却用知识改变着一个又一个学生的命运。\n感谢老师，最好的方式就是认真学习，将所学到的知识运用到生活中，未来成为对社会有用的人。这是对老师最好的报答。"}, {"title": "参观博物馆", "level": "阅读短文（小学五六年级）", "text": "上周，学校组织我们参观了市博物馆。这是我第一次认真参观博物馆，印象非常深刻。\n博物馆里陈列着从古至今的各种文物：精美的青铜器、古老的陶瓷、历代的书法作品……每一件展品背后都有一段历史故事。讲解员阿姨带着我们参观，用生动的语言介绍每件文物的来历和意义。\n让我印象最深的是一件汉代的陶俑，做工精细，神态生动，已经有两千多年的历史。站在它面前，仿佛穿越了时空，与古人对话。参观博物馆，让我更加深刻地感受到中华文化的博大精深。"}, {"title": "运动会", "level": "阅读短文（小学五六年级）", "text": "秋天里，我们学校举行了一年一度的运动会。整个校园沸腾了，同学们个个摩拳擦掌，跃跃欲试。\n我报名参加了一百米跑和跳远比赛。一百米跑，发令枪一响，我拼命向前冲，最终以第三名的成绩完成了比赛。虽然没有第一，但是我已经超越了自己的最好成绩，我为自己骄傲。\n跳远比赛中，我跳出了四米二的成绩，获得了第二名。站在颁奖台上，接过奖状的那一刻，我感受到了努力的意义。运动会让我明白，只要全力以赴，无论结果如何，都是成功的。"}, {"title": "学习外语的好处", "level": "阅读短文（小学五六年级）", "text": "在当今全球化的世界里，学习外语变得越来越重要。语言是沟通的桥梁，掌握了外语，就打开了通向另一个世界的大门。\n学习外语能让我们直接阅读外文书籍和资料，获取更广泛的信息；可以看外语原版电影，了解其他国家的文化；随着中国与世界的联系日益密切，外语能力在工作中也越来越受到重视。\n学习外语还能促进大脑发育。研究表明，会说多种语言的人，大脑中负责语言和记忆的区域更为发达。当然，学外语需要持之以恒，每天坚持听说读写，勇于开口练习，才能真正掌握一门外语。"}, {"title": "时间的宝贵", "level": "阅读短文（小学五六年级）", "text": "一寸光阴一寸金，寸金难买寸光阴。时间是世界上最公平的东西，每个人每天都只有二十四小时，无论贫富，无论地位高低。\n时间的可贵，在于它一去不回。流逝的时间，永远无法追回。年少时不努力学习，长大后再后悔，也无济于事。那些成功的人，往往是最善于利用时间的人。他们不虚度光阴，将每一分钟都用在有意义的事情上。\n合理安排时间，是一门重要的学问。学习时专心致志，玩耍时放松享受，制定计划，按时完成任务，逐渐养成良好的时间观念。珍惜时间，就是珍惜生命。"}, {"title": "城市与农村", "level": "阅读短文（小学五六年级）", "text": "中国既有高楼林立的现代都市，也有田园诗意的广大农村。城市与农村，各有其独特的魅力和生活方式。\n城市里，交通便捷，教育医疗资源丰富，娱乐设施齐全，工作机会多，生活节奏快。农村里，空气清新，风景优美，生活节奏慢，邻里关系亲密。\n近年来，随着新农村建设的推进，农村面貌发生了很大变化：道路硬化、网络普及、医疗改善……城乡差距正在逐步缩小。无论城市还是农村，都是人们赖以生存的家园。我们应当珍惜各自独特的生活，同时也为建设更美好的城乡而努力。"}, {"title": "梦想与努力", "level": "阅读短文（小学五六年级）", "text": "每个人心中都有一个梦想。有人想成为科学家，有人想成为运动员，有人想成为艺术家……梦想是人生的灯塔，给我们指明前进的方向。\n然而，梦想不会自动变成现实。在梦想与现实之间，有一座桥叫做努力。没有努力，再美好的梦想也只是空想。\n努力是什么？努力是每天早起一小时多读书，是失败了再爬起来继续尝试，是面对困难不退缩，是在别人放弃时坚持下去。怀揣梦想，脚踏实地，一步一步向前走。每天进步一点点，终有一天会发现，自己已经站在了曾经仰望的地方。"}, {"title": "诚实守信", "level": "阅读短文（小学五六年级）", "text": "言必信，行必果。诚实守信是中华民族的传统美德，也是现代社会对每个人的基本要求。\n诚实意味着说真话，不欺骗。即使说真话会让自己暂时处于不利地位，也要坚守这一原则。历史上，商鞅立木为信，取得了百姓的信任，才能顺利推行变法；曾子为了不让孩子失望，坚持杀猪兑现诺言。这些故事告诉我们，信用是最宝贵的财富。\n在现代社会，诚信尤为重要。企业靠诚信赢得客户，个人靠诚信赢得尊重。从小养成诚实守信的品格，这是一个人最基本、也最重要的修养。"}, {"title": "友谊的力量", "level": "阅读短文（小学五六年级）", "text": "人的一生中，友谊是最宝贵的财富之一。真正的朋友，不是在你高兴时和你一起欢笑，而是在你困难时伸出援手，在你犯错时指出问题，在你孤独时陪伴你。\n好朋友之间的影响是巨大的。与积极向上的人为友，我们会受到感染，变得更加努力上进；与志同道合的人为友，我们会找到共同追求的目标，相互激励。\n珍惜友谊，需要用心去维护。坦诚相待，互相尊重，在朋友需要时给予支持，这是保持友谊长存的方法。好朋友，是人生中最宝贵的礼物。"}, {"title": "面对挫折", "level": "阅读短文（小学五六年级）", "text": "人生不可能一帆风顺，每个人都会遇到各种各样的挫折和失败。重要的不是我们是否遭受了挫折，而是我们面对挫折的态度。\n有的人遇到困难就退缩，一次失败就一蹶不振；有的人则从失败中汲取教训，调整方向，继续前进。两种截然不同的态度，决定了截然不同的人生结果。\n爱迪生发明灯泡失败了数千次，他说每次失败都是告诉他这种方法行不通，距离成功更近了一步。这种面对挫折的积极态度，正是他最终成功的关键。挫折不是终点，只是人生路上的一块绊脚石。跨过它，前面是更广阔的天地。"}, {"title": "我的理想职业", "level": "阅读短文（小学五六年级）", "text": "长大以后，我想成为一名建筑师。每当看到那些宏伟美丽的建筑，我都会想：这些是怎么设计出来的？能设计这样的建筑，一定是件很有意义的事情。\n建筑师要懂得很多知识，不仅要掌握数学、物理等理科知识，还要有艺术修养，了解历史和文化。一栋好的建筑，既要坚固安全，又要美观实用，还要与周围的环境和谐共处。\n我现在的任务是打好基础，认真学习数学和美术，多看一些关于建筑的书籍，培养自己的审美能力。我相信，只要坚定目标，脚踏实地，有一天我一定能实现我的理想。"}, {"title": "珍惜粮食", "level": "阅读短文（小学五六年级）", "text": "锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。这首古诗生动描述了农民耕种的艰辛，提醒我们珍惜每一粒粮食。\n粮食的生产离不开农民的辛勤劳作。从播种到收获，需要经历几个月的时间，经受风吹日晒雨淋，克服病虫害的威胁。每一粒米、每一块面包，都凝结着劳动者的汗水。\n然而浪费粮食的现象十分普遍。据统计，全球每年浪费的粮食足以养活数十亿人。珍惜粮食，是对劳动者的尊重，也是节约资源、保护环境的具体行动。吃多少打多少，不浪费食物，是我们每个人都应该做到的。"}, {"title": "丝绸之路", "level": "阅读短文（小学五六年级）", "text": "丝绸之路是古代连接中国与中亚、西亚乃至欧洲的贸易通道，因中国的丝绸通过这条路传到西方而得名。它不仅仅是一条贸易路线，更是一条文化交流之路。\n通过丝绸之路，中国的丝绸、茶叶、瓷器、造纸术和印刷术传到了西方；西方的葡萄、胡萝卜、玻璃制品传到了中国。两千多年来，无数商人、使节和僧侣沿着这条路，沟通了东西方文明。\n今天，中国提出一带一路倡议，正是对古代丝绸之路精神的传承和发展。丝绸之路的故事告诉我们，文明因交流而丰富，因互鉴而发展。"}, {"title": "中国名胜古迹", "level": "阅读短文（小学五六年级）", "text": "中国幅员辽阔，历史悠久，留下了无数举世闻名的名胜古迹。长城、故宫、西湖、泰山、黄山……这些名字代表着中华文明的厚度与广度。\n长城被誉为世界七大奇迹之一，绵延数千公里，是中华民族勤劳与智慧的象征。故宫是世界上保存最完好的木质结构皇家建筑群，规模宏大，令人叹为观止。西湖以淡妆浓抹总相宜享誉天下，自古以来吸引无数文人墨客流连忘返。\n这些名胜古迹不仅是旅游景点，更是历史的见证，是中华民族文化认同的重要载体。参观这些地方，就是在阅读一部活生生的历史书。"}, {"title": "青春的烦恼", "level": "阅读短文（初中一年级）", "text": "步入初中，我仿佛踏入了一个全新的世界。课程变多了，难度加深了，身边的同学似乎都比小学时更加成熟。有时候，我会感到一丝迷茫和困惑，这就是人们常说的青春的烦恼吧。\n学业的压力让我有时候喘不过气来。数学的难题、历史的背诵、英语的语法……每一科都需要投入大量的时间和精力。有时候感觉时间永远不够用，作业永远做不完。\n但是，我渐渐学会了调整心态。遇到难题时，不是逃避，而是迎难而上；感到疲惫时，适当放松，然后再投入学习。青春的烦恼，其实也是成长的阶梯。每一次克服困难，我都比昨天的自己更强大。"}, {"title": "初中生活的开始", "level": "阅读短文（初中一年级）", "text": "小学六年的时光，在依依不舍中画上了句点。背上新书包，踏入初中校门的那一刻，我感受到了新鲜感与紧张感交织的复杂情绪。\n初中比小学大多了，教学楼更高，走廊更长，操场更宽阔。陌生的面孔出现在眼前，来自不同小学的同学聚集在一起，组成了新的班级。开学第一天，大家都有些拘谨，互相打量，小心翼翼地问彼此的名字和来处。\n班主任是一位年轻的女老师，她说：初中是你们人生中非常重要的阶段。在这三年里，你们不仅要学习知识，更要学会如何做一个有担当、有理想的人。这句话深深地印在了我的心上。"}, {"title": "学习的意义", "level": "阅读短文（初中一年级）", "text": "有人问：为什么要学习？这个问题看似简单，却值得认真思考。\n学习，最直接的目的是掌握知识和技能，为将来的工作和生活做准备。但学习的意义远不止于此。学习的过程，是一个认识世界、认识自我的过程。通过学习，我们了解人类数千年积累的智慧，了解自然的规律，了解社会的运行方式。\n学习还教会我们如何面对挑战。每一道难题，每一篇难懂的文章，都是对意志力和耐心的锻炼。克服学习中的困难，让我们更有能力面对生活中更大的挑战。所以，学习不是负担，而是通往更广阔世界的道路。"}, {"title": "心理健康的重要性", "level": "阅读短文（初中一年级）", "text": "身体健康固然重要，但心理健康同样不可忽视。随着社会竞争压力的增加，青少年的心理健康问题日益受到关注。\n保持心理健康，首先要学会认识自己的情绪。当感到焦虑或难过时，不要压抑，而是承认这种感受，找到合适的方式排解，比如运动、听音乐、与朋友倾诉或写日记。\n其次，要学会设立合理的期望。不必事事追求完美，允许自己犯错，从错误中学习成长。不要总是拿自己与他人比较，每个人都有自己独特的成长节奏。遇到心理困扰时，要勇于寻求帮助。"}, {"title": "网络安全意识", "level": "阅读短文（初中一年级）", "text": "互联网的普及给我们带来了极大的便利，但同时也带来了各种安全风险，尤其对于青少年而言，树立网络安全意识至关重要。\n网络安全风险主要包括：个人信息泄露、网络诈骗、网络暴力、接触不良内容等。有些不法分子会通过网络获取未成年人的个人信息，实施诈骗或更严重的违法行为。\n保护自己的网络安全，需要注意：不随意在网上透露真实姓名、住址、联系方式等个人信息；对陌生人的网络邀请保持警惕；遇到网络欺凌及时告诉家长和老师。网络是一把双刃剑，学会合理、安全地使用网络，是现代青少年必备的能力。"}, {"title": "文明礼仪", "level": "阅读短文（初中一年级）", "text": "没有规矩，不成方圆。文明礼仪是社会生活的基本规范，是个人素质的外在体现，也是中华民族的优良传统。\n在公共场合，我们应当遵守秩序，不大声喧哗，不插队，爱护公共设施。乘坐公共交通时，给老弱病残让座；进入图书馆、博物馆，保持安静；排队购票或购物，遵循先来后到的原则。\n在人际交往中，礼貌待人是最基本的要求。见到长辈主动问好，接受别人的帮助说谢谢，妨碍了别人说对不起……这些看似细小的言行，体现了一个人的教养。文明礼仪不仅是个人形象的体现，更是社会文明程度的体现。"}, {"title": "勇于创新", "level": "阅读短文（初中一年级）", "text": "创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭动力。在这个科技飞速发展的时代，创新能力显得尤为重要。\n创新不只是科学家和工程师的事，它体现在生活的方方面面。一道数学题的新颖解法，一篇作文独特的视角，一个课外小实验的设计……这些都是创新思维的体现。\n培养创新能力，需要保持好奇心，敢于提问，善于观察。许多伟大的发明，都源于对日常现象的好奇：牛顿看到苹果落地，思考引力的本质；瓦特看到水壶中沸腾的水蒸气，思考蒸汽的力量。我们青少年应当珍惜这种创造力，不墨守成规，勇于尝试新的想法和方法。"}, {"title": "公益与责任", "level": "阅读短文（初中一年级）", "text": "在社会生活中，每个人既是权利的享有者，也是责任的承担者。公益活动是承担社会责任的重要形式，它让个人的力量汇聚成改变社会的力量。\n公益活动的形式多种多样：为贫困学生捐书捐物，参加环保志愿活动，为孤寡老人提供服务，参与社区建设……这些活动，不需要多大的能力，只需要一颗愿意付出的心。\n参与公益活动，对参与者本身也有很大的收获。它让我们走出自己的小世界，了解社会的真实面貌，培养同理心和社会责任感。作为社会的一员，从现在开始，积极参与力所能及的公益活动，做一个有社会责任感的人。"}, {"title": "批判性思维", "level": "阅读短文（初中一年级）", "text": "在信息爆炸的时代，我们每天接触到海量的信息。并非所有信息都是准确可靠的，因此培养批判性思维显得尤为重要。\n批判性思维，简单来说就是独立思考、理性分析、不轻易相信和不盲目跟从的能力。面对一条信息，我们不应该只问是什么，还要问为什么、怎么知道的、有没有其他可能性。\n在学习中，批判性思维体现在独立思考老师的讲解，发现书本上可能存在的局限，敢于提出不同意见并说明理由。培养批判性思维，需要广泛阅读，积累知识，学习基本的逻辑，保持开放的心态，愿意倾听不同观点，更新自己的认识。"}, {"title": "历史的价值", "level": "阅读短文（初中一年级）", "text": "历史是一门关于过去的学科，但它的价值却在于现在和未来。以史为鉴，可以知兴替。学习历史，让我们了解人类社会的发展规律，从前人的经验教训中获取智慧。\n中国有着五千年连续不断的文明史，这是全世界独一无二的。通过学习历史，我们能了解中华民族是如何从远古走到今天，如何在与自然的抗争和人类社会的演变中，形成了独特的文化和精神。这种了解，是民族认同感和文化自信的来源。\n历史也告诉我们，任何看起来牢不可破的力量，最终都会走向衰落；任何看起来无法逾越的困境，都有可能被克服。了解历史，是为了更好地走向未来。"}, {"title": "生态平衡", "level": "阅读短文（初中一年级）", "text": "地球上的生物种类繁多，相互依存，构成了复杂的生态系统。在这个系统中，每一种生物都扮演着不可或缺的角色，维持着整体的平衡。一旦某一环节出现问题，可能引发连锁反应，导致整个生态系统崩溃。\n以食物链为例：草地上的植物被兔子吃掉，兔子被狐狸捕食，狐狸死后分解为有机物，回归土壤，滋养植物。如果人类大量猎杀狐狸，兔子就会急剧增多，把草地啃食一空，最终草地沙漠化，连兔子也无法生存。\n保护生态平衡，需要减少对野生动植物的干扰，保护森林、湿地等自然栖息地。人类是地球上最有责任保护地球生态的物种。"}, {"title": "传统文化的传承", "level": "阅读短文（初中一年级）", "text": "在全球化的浪潮中，各种文化相互碰撞、融合，传统文化面临着前所未有的挑战。如何在现代化的进程中传承和保护传统文化，是当今社会面临的重要课题。\n中国传统文化博大精深，包含着诗词、书法、绘画、音乐、戏曲、武术等各种艺术形式，以及儒道佛三家的哲学思想。这些文化遗产，凝聚了中华民族几千年的智慧和审美。\n传承传统文化，需要学校教育的重视，也需要社会各界的共同努力。更重要的是，每一个年轻人都应当主动去了解和学习传统文化。只有当传统文化真正活在年轻人的心中，它才能真正得到传承和发展。"}, {"title": "可持续发展", "level": "阅读短文（初中一年级）", "text": "可持续发展是当今世界的核心发展理念，它指的是既满足当代人的需求，又不损害后代人满足其需求的能力的发展模式。简单来说，就是既要发展，又要保护，不能以牺牲环境和子孙的利益为代价换取今天的繁荣。\n当前，不可持续的发展模式已经带来了严重问题：资源枯竭、环境污染、气候变化……这些问题的根源，在于人类对自然资源的过度消耗和对环境的漠视。\n推进可持续发展，需要发展清洁能源，推广绿色生产方式，建立资源循环利用体系。可持续发展不只是政府的责任，也是每个公民的责任，从我们身边的小事做起，共同守护赖以生存的地球。"}, {"title": "民族团结", "level": "阅读短文（初中一年级）", "text": "中国是一个统一的多民族国家，共有五十六个民族，各民族在长期的历史发展中，形成了你中有我、我中有你的深厚情谊。民族团结，是中国各民族人民的共同愿望，也是国家繁荣昌盛的根本保障。\n中国各民族虽然语言不同、习俗各异，但都是中华民族大家庭的一员，共同创造了中华文明的灿烂历史。从秦汉时期的多民族统一国家，到今天五十六个民族共同建设现代化国家，民族融合与团结始终是中国历史的主旋律。\n民族团结需要相互尊重、相互理解。尊重各民族的风俗习惯，欣赏各民族的文化艺术，理解不同的生活方式，这些都是民族团结的基础。"}, {"title": "中华文明的特点", "level": "阅读短文（初中一年级）", "text": "中华文明是世界上最古老的文明之一，也是唯一延续至今未曾中断的文明。这一文明有其独特的特点，值得我们深入了解和思考。\n首先，中华文明具有极强的包容性和吸收性。几千年来，中华文化不断与其他文化交流融合，吸纳外来文化的精华，使自身不断丰富和发展。\n其次，中华文明注重和谐，强调天人合一、人与自然和谐相处，注重人与人之间的和睦关系。\n第三，中华文明具有强烈的家国情怀，强调个人对家庭、家庭对国家的责任。这些特点，使中华文明在面对各种历史挑战时，具有强大的韧性和生命力，得以延续五千年而不衰。"}, {"title": "志愿服务精神", "level": "阅读短文（初中一年级）", "text": "志愿服务是现代社会文明进步的重要标志，它体现了人类守望相助、共建美好社会的精神。志愿者不为报酬，自愿奉献时间和精力，为他人和社会提供服务。\n在中国，越来越多的人加入了志愿者的行列。他们活跃在灾难救援现场、社区服务站、学校和医院，为需要帮助的人提供力所能及的支持。每届大型活动中，数以万计的志愿者默默付出，为活动的顺利进行作出了重要贡献。\n参与志愿服务，让我们走出自己的生活圈，接触更广泛的社会，培养同理心和社会责任感，同时也锻炼了沟通协作能力。志愿服务精神，是人类最美好的品质之一。"}, {"title": "法律意识", "level": "阅读短文（初中一年级）", "text": "法律是社会生活的基本规则，是维护社会秩序和公平正义的重要保障。从交通法规到合同法，法律渗透在我们生活的方方面面。\n对于青少年来说，树立法律意识非常重要。首先，要知法守法，了解与自己生活相关的基本法律，知道什么可以做，什么不能做；其次，要学会用法律保护自己，当自身权益受到侵害时，知道通过法律途径维权；第三，要明白违法的代价，任何违法行为都会受到相应的惩处。\n近年来，青少年违法犯罪问题引发了社会广泛关注，究其原因，往往是缺乏法律意识。从小培养法律意识，做一个知法懂法守法的公民，是每个青少年的重要课题。"}, {"title": "健康的生活方式", "level": "阅读短文（初中一年级）", "text": "健康是人生最宝贵的财富，而健康的生活方式是维护健康的基础。在初中阶段，正处于身体和心理快速发展的关键时期，养成良好的生活习惯尤为重要。\n合理膳食是健康的基础。要注意营养均衡，多吃蔬菜水果，适量摄入蛋白质，减少高糖高脂食品的摄入，养成规律的饮食习惯。充足睡眠对青少年的成长至关重要，初中生每天需要八到九小时的睡眠。\n此外，坚持体育锻炼、减少久坐时间、保持良好心态，也是健康生活方式的重要组成部分。健康的生活方式，需要从现在开始，从日常小事做起，持之以恒。"}, {"title": "兴趣与特长", "level": "阅读短文（初中一年级）", "text": "每个人都有自己的兴趣和特长。有人擅长音乐，有人对数学有天赋，有人在绘画方面才华横溢，有人在运动方面表现出色……这些兴趣和特长，是我们独特性的体现，也是我们未来发展的重要资源。\n发现和培养兴趣与特长，对青少年的成长至关重要。兴趣是最好的老师。当我们对某件事情充满热情时，我们会主动投入更多时间和精力，学习效率也会大幅提高。\n当然，全面发展同样重要，不能因为专注于某一兴趣而偏废其他科目的学习。在打好全面基础的同时，让自己的兴趣和特长充分发展，才能在未来找到属于自己的位置，发挥独特的价值。"}, {"title": "终身学习", "level": "阅读短文（初中一年级）", "text": "在这个知识更新速度越来越快的时代，终身学习已经从一种理念变成了每个人的生存需求。过去，人们在学校里学到的知识，足以支撑整个职业生涯；而今天，任何领域的知识都在以惊人的速度更新换代。\n终身学习意味着，学习不仅仅发生在学校里，不仅仅是为了考试和文凭，而是一种贯穿整个生命的生活方式。它包括正式的学习，如参加培训课程、攻读学位；也包括非正式的学习，如阅读、在工作中积累经验。\n培养终身学习的能力，关键在于保持好奇心和开放的心态。学会如何学习，比学到具体的知识更重要，因为后者可能会过时，而前者的价值却会永恒。"}, {"title": "全面发展的重要性", "level": "阅读短文（初中一年级）", "text": "教育的目标，不仅仅是培养学业成绩优异的学生，更是培养德智体美劳全面发展的人才。这五个方面，缺一不可，相互促进，共同构成了一个完整而健全的人。\n德，是品德，是为人处世的根本；智，是智识，是认识世界的能力；体，是体魄，是健康的身体和充沛的精力；美，是审美，是对美好事物的感知能力；劳，是劳动，是参与实践、创造价值的能力。\n一些学生和家长过分注重学科成绩，忽视了其他方面的培养。这种做法培养出来的学生，可能成绩不错，但在实际生活中却缺乏解决问题的能力、与人合作的技巧、面对挫折的韧性。全面发展，让我们成为一个完整的人。"}, {"title": "我的书包", "level": "阅读短文（小学三四年级）", "text": "我有一个蓝色的书包，是开学前妈妈给我买的。书包上印着一只可爱的小熊，我非常喜欢。\n书包里装着课本、笔袋和水杯，虽然有点重，但是我每天都背着它高高兴兴地去上学。\n有一次书包的拉链坏了，妈妈耐心地帮我缝好了，还说这个书包还能陪我读完小学。我要好好爱护我的书包。\n以后不管书包变得多旧，我都会把它当作一件重要的物品好好保管。"}, {"title": "上学的路上", "level": "阅读短文（小学三四年级）", "text": "每天早上，我走路去上学，路上要经过一座小桥和一片树林。桥下的小河哗哗地流着，好像在唱歌。\n树林里有很多小鸟，它们在树枝上跳来跳去，叽叽喳喳地叫着，好像在欢迎我上学。\n有时候我会碰到同班的小伙伴，我们一边走一边聊天，路程一下子就变得不那么远了。上学的路，是我一天中最快乐的开始。"}, {"title": "我的铅笔盒", "level": "阅读短文（小学三四年级）", "text": "我的铅笔盒是长方形的，上面画着一只小熊猫，是爸爸从北京给我带回来的礼物。\n铅笔盒里放着两支铅笔、一块橡皮和一把小尺子，每样东西都有固定的位置，整整齐齐。\n每天写完作业，我都会把铅笔盒收拾好，检查铅笔有没有削尖。妈妈说，爱惜文具的孩子，学习也会更认真。我很喜欢我的铅笔盒。"}, {"title": "快乐的手工课", "level": "阅读短文（小学三四年级）", "text": "今天上手工课，老师教我们用彩纸做小房子。老师先示范了一遍，然后让我们自己动手。\n我先剪出房子的墙壁，再剪出屋顶，最后用胶水把它们粘在一起。虽然一开始粘得歪歪扭扭，但是慢慢就熟练了。\n下课的时候，我的小房子终于做好了，虽然不算完美，但是我很有成就感。老师夸我很有耐心，我把小房子带回家送给了妈妈。"}, {"title": "我的水杯", "level": "阅读短文（小学三四年级）", "text": "我有一个粉色的水杯，杯身上印着几朵小花，是我最喜欢的颜色。妈妈每天早上都会给我灌满温水带去学校。\n课间的时候，我会拿出水杯喝水。老师说多喝水对身体好，能让我们上课更有精神。\n有一次我不小心把水杯摔在地上，杯盖摔坏了。妈妈没有骂我，只是又给我买了一个新的杯盖，还提醒我以后要小心。我很珍惜我的水杯。"}, {"title": "校园里的大树", "level": "阅读短文（小学三四年级）", "text": "我们学校操场旁边有一棵很大的树，听老师说它已经有五十多年的历史了，比爷爷的年纪还大。\n夏天的时候，大树的叶子长得又多又密，同学们都喜欢在树荫下乘凉，一边休息一边聊天。\n秋天到了，树上的叶子变黄了，风一吹就纷纷飘落下来。我们喜欢捡起落叶做书签。这棵大树陪伴了一届又一届的学生，是我们学校最好的朋友。"}, {"title": "我的班级", "level": "阅读短文（小学三四年级）", "text": "我们班一共有三十八个同学，教室在教学楼的三楼。教室里贴着许多我们自己画的画，五颜六色，非常漂亮。\n班里的黑板报每个月都会换一次新的内容，由值日的同学负责设计和布置。这个月的主题是保护环境。\n我们班同学之间关系很好，谁有困难大家都愿意帮忙。老师常说，我们班就像一个大家庭。我很喜欢我的班级。"}, {"title": "数学课", "level": "阅读短文（小学三四年级）", "text": "我最喜欢上数学课了。今天老师教我们学习乘法口诀，虽然一开始有点难记，但是多读几遍就顺口了。\n老师用小棒子摆出各种图形，帮我们理解乘法的意思，讲得非常生动。我很快就掌握了三的乘法口诀。\n下课后，老师给做对题目的同学发了小贴纸，我得到了三张，心里美滋滋的。我要更加努力，把数学学得更好。"}, {"title": "一次考试", "level": "阅读短文（小学三四年级）", "text": "这个星期，我们进行了期中考试。考试前几天，我每天晚上都认真复习，把课本上的知识点都看了一遍。\n考试的时候，我认真读题，仔细检查，遇到不会的题目也没有慌张，而是先跳过去做后面的题。\n考试结束后，我心里有点紧张，不知道自己考得怎么样。发试卷那天，老师说我进步了很多，我心里非常高兴。"}, {"title": "我的英语老师", "level": "阅读短文（小学三四年级）", "text": "我们班的英语老师姓刘，大家都叫她刘老师。她说话很有活力，上课的时候常常带我们唱英语歌曲。\n刘老师教我们的方法很有趣，她会用卡片、图画来帮助我们记单词，学起来一点也不枯燥。\n有一次我英语听写全对，刘老师在我的本子上画了一个大大的笑脸，还表扬了我。我越来越喜欢学英语了。"}, {"title": "课间十分钟", "level": "阅读短文（小学三四年级）", "text": "下课铃一响，同学们像小鸟一样飞出教室。有的去操场上跳绳，有的在走廊里聊天，还有的去洗手间。\n我最喜欢和同学们一起玩丢沙包的游戏。虽然只有短短十分钟，但是大家玩得非常开心。\n上课铃一响，大家又急忙跑回教室，坐好等老师来上课。虽然课间只有十分钟，却是我们一天中最放松的时光。"}, {"title": "我的橡皮", "level": "阅读短文（小学三四年级）", "text": "我有一块粉红色的橡皮，是文具店里最普通的一种，但是我用得非常顺手。它已经陪了我一个学期了。\n每次写错字，我都会用它轻轻地擦掉，一点也不会把纸弄破。同桌的橡皮总是掉在地上，我的却从不乱丢。\n虽然橡皮已经变小了，但我舍不得扔掉。妈妈说，用东西要爱惜，不能因为它变小了就不珍惜了。"}, {"title": "做手工风筝", "level": "阅读短文（小学三四年级）", "text": "周末，爸爸带我一起做风筝。我们先用竹条搭出骨架，再糊上一张彩色的纸，最后系上长长的线绳。\n爸爸告诉我，风筝要做得左右对称，飞起来才不会歪歪扭扭。我照着爸爸说的，仔细地把纸粘好。\n第二天，我们去公园放风筝，风筝顺着风慢慢升上天空，越飞越高。看着自己做的风筝飞起来，我特别自豪。"}, {"title": "我家的阳台", "level": "阅读短文（小学三四年级）", "text": "我家有一个小阳台，妈妈在上面种了很多花草，有月季、绿萝，还有几盆小番茄。\n每天放学回家，我都会去阳台看看花草，帮妈妈浇浇水。看到植物一天天长大，心里特别开心。\n夏天的傍晚，我喜欢坐在阳台上乘凉，看着天边的晚霞。阳台虽然不大，却是我家最温馨的角落。\n妈妈说，只要用心照顾，普通的阳台也能变成一个美丽的小花园。"}, {"title": "我的自行车", "level": "阅读短文（小学三四年级）", "text": "我有一辆红色的自行车，是我过生日的时候爸爸送给我的礼物。第一次看到它，我高兴得跳了起来。\n刚开始骑的时候，我总是掌握不好平衡，摔了好几次。爸爸在后面扶着我，耐心地教我怎么控制方向。\n经过一个星期的练习，我终于能自己骑车了。现在每天傍晚，我都会骑着它在小区里转几圈，特别开心。"}, {"title": "一次郊游", "level": "阅读短文（小学三四年级）", "text": "学校组织我们去郊外的农场参观。一路上，同学们又唱歌又聊天，车厢里充满了欢声笑语。\n到了农场，我们看到了很多动物，有奶牛、绵羊，还有一群会跑的小鸡。我们还亲手采摘了新鲜的草莓。\n中午，大家坐在草地上吃自带的午饭，感觉格外香甜。这次郊游让我看到了课本以外的世界，学到了很多知识。"}, {"title": "我的表弟", "level": "阅读短文（小学三四年级）", "text": "我有一个表弟，比我小两岁，非常调皮，但也十分可爱。每次放假去姥姥家，我们都会一起玩。\n表弟最喜欢玩积木，他能搭出各种各样的形状，有城堡，有汽车，还有他自己想象出来的怪东西。\n虽然我们有时候也会因为玩具吵架，但是很快就会和好。表弟说我是他最好的哥哥，我听了心里暖暖的。"}, {"title": "爷爷的故事", "level": "阅读短文（小学三四年级）", "text": "每天晚上睡觉前，爷爷都会给我讲故事。他年轻的时候当过兵，去过很多地方，经历了不少有趣的事情。\n爷爷讲故事的时候，声音很有磁性，把每一个情节都讲得生动有趣，我总是听得入了迷，忘记了时间。\n爷爷说，他小时候家里很穷，没有条件读书，所以特别希望我能珍惜现在的学习机会。我听后暗暗下决心，一定要好好学习。"}, {"title": "奶奶的拿手菜", "level": "阅读短文（小学三四年级）", "text": "奶奶做菜的手艺特别好，她的拿手菜是红烧排骨，每次做，整个屋子都香气四溢。\n奶奶说做菜的秘诀是耐心，要小火慢炖，让排骨的味道慢慢渗透进去，这样才能做得又香又软。\n每次放假回奶奶家，她都会特意做这道菜给我吃。看着我吃得津津有味，奶奶脸上总是露出满足的笑容。\n我也想跟奶奶学做这道菜，以后自己也能做给家人吃，把这份味道传承下去。"}, {"title": "我的爷爷", "level": "阅读短文（小学三四年级）", "text": "我的爷爷已经七十岁了，但是身体依然很硬朗。他每天早上都坚持去公园散步，晚上还会看书看报。\n爷爷是个很有耐心的人，从来不发脾气。每次我遇到不会做的题目，他都会一步一步地教我，直到我弄明白。\n爷爷常说，做人要正直善良，做事要脚踏实地。我很尊敬我的爷爷，他是我心目中最智慧的长辈。"}, {"title": "妈妈的生日", "level": "阅读短文（小学三四年级）", "text": "上个星期是妈妈的生日，我和爸爸商量好要给她一个惊喜。我们悄悄准备了一个蛋糕和一束鲜花。\n那天晚上，妈妈刚进家门，我和爸爸就把灯打开，一起喊生日快乐。妈妈非常惊讶，眼睛都湿润了。\n我送给妈妈一张自己制作的贺卡，上面写满了我想对她说的话。妈妈说，这是她收到的最珍贵的礼物。"}, {"title": "爸爸的生日", "level": "阅读短文（小学三四年级）", "text": "今天是爸爸的生日，我早早就起床，用零花钱给爸爸买了一份小礼物，是他一直想要的钢笔。\n晚上，妈妈做了一大桌好菜，我们一家人围在一起，一边吃饭一边聊天，气氛非常温馨。\n吃完饭，我把礼物送给爸爸，他打开包装的时候特别开心，一直夸我懂事了。我心里也美滋滋的。\n看着爸爸开心的笑容，我觉得这是我度过的最有意义的一个晚上。"}, {"title": "我的姐姐", "level": "阅读短文（小学三四年级）", "text": "我有一个姐姐，比我大三岁，她学习成绩很好，也很会照顾人。放学回家，她经常帮我检查作业。\n姐姐喜欢看书，家里的书架上摆满了她的书。她还会给我讲书里的故事，我听得特别入迷。\n有一次我和同学吵架了，心情很不好，姐姐耐心地开导我，教我怎么和朋友和好。我很感谢有这样一个姐姐。"}, {"title": "我的弟弟", "level": "阅读短文（小学三四年级）", "text": "我有一个五岁的弟弟，虽然年纪小，但是特别喜欢跟着我。我做什么，他都想学着做。\n弟弟最喜欢玩汽车玩具，他能自己在地上摆出一条长长的马路，把小汽车开来开去，玩得不亦乐乎。\n虽然照顾弟弟有时候很累，但是看到他天真的笑容，我心里就充满了幸福感。我要做一个好哥哥，好好照顾他。"}, {"title": "打乒乓球", "level": "阅读短文（小学三四年级）", "text": "我最近迷上了打乒乓球。每天放学后，我都会和同学在学校的乒乓球台前练习一会儿。\n刚开始的时候，我连球都接不好，经常打飞。经过不断的练习，我渐渐掌握了拍球的技巧。\n上个星期，我参加了班级的乒乓球比赛，虽然没有拿到第一名，但是能进入前三名，我已经非常满足了。\n老师说，坚持练习任何一项运动，都能让我们变得更加自信和健康。"}, {"title": "跳绳比赛", "level": "阅读短文（小学三四年级）", "text": "学校举行了跳绳比赛，我从一个月前就开始练习了。每天晚上，我都会在小区的空地上跳一会儿绳。\n比赛那天，我特别紧张，心跳得咚咚的。轮到我的时候，我深吸一口气，开始认真地跳。\n最后，我一分钟跳了一百二十下，得到了全班第二名的好成绩。老师夸我坚持练习是成功的关键，我心里非常自豪。"}, {"title": "我最喜欢的颜色", "level": "阅读短文（小学三四年级）", "text": "我最喜欢的颜色是蓝色，因为它让我想起天空和大海，看起来非常宁静，让人的心情也变得平和。\n我的书包、水杯，还有很多衣服都是蓝色的。妈妈说我像个小小的蓝色收藏家。\n每次画画，我总是喜欢用蓝色画天空和河流。老师说色彩能反映一个人的心情，我想我一定是一个心态平静的孩子。\n每次穿上蓝色的衣服，我都感觉自己特别有精神，心情也变得格外愉快。"}, {"title": "下雨天", "level": "阅读短文（小学三四年级）", "text": "今天下雨了，我撑着雨伞去上学。雨水打在伞上，发出滴滴答答的声音，就像在演奏一首曲子。\n路上，我看见小水坑里有很多小雨点在跳舞，一圈一圈的波纹十分好看，我忍不住停下来看了一会儿。\n虽然下雨天出门有点不方便，但是我很喜欢雨天的味道，湿润的空气让人感到特别清新舒服。\n回到家，妈妈已经准备好了一条干毛巾，帮我擦干头发，心里暖暖的。"}, {"title": "刮风的日子", "level": "阅读短文（小学三四年级）", "text": "今天风很大，走在路上，风吹得我的衣服哗哗作响，头发也被吹得乱七八糟的。\n路边的大树被风吹得摇摇晃晃，树叶发出沙沙的响声，好像在和风打招呼。\n虽然风让人走路有点困难，但是我很喜欢刮风的感觉，那种畅快让我觉得自己好像也能飞起来一样。\n回到家后，妈妈笑着帮我把头发梳理整齐，让我赶紧洗手，别着凉了。"}, {"title": "我的雨伞", "level": "阅读短文（小学三四年级）", "text": "我有一把黄色的小雨伞，上面画着一只小鸭子，非常可爱。这是妈妈特意给我买的。\n每次下雨，我都会带着它去上学，撑开的时候，感觉自己像一朵移动的小蘑菇，特别有趣。\n有一次下雨，我看到有个同学没带伞，我主动和他一起打伞回家。他非常感谢我，我心里也很开心。\n妈妈说，帮助别人是一件很快乐的事情，我以后还会这样做。"}, {"title": "冬天的早晨", "level": "阅读短文（小学三四年级）", "text": "冬天的早晨特别冷，被窝里暖暖的，我一点也不想起床，但是想到要上学，还是咬牙爬了起来。\n打开窗户，外面结了一层薄薄的霜，草叶上像是撒了一层白糖，非常美丽。\n妈妈早早地给我准备好了热腾腾的早饭。喝一口热粥，全身都暖和起来了，我背上书包，精神饱满地出门了。\n走在上学的路上，寒冷的空气也变得可爱起来，我一点也不觉得冷了。"}, {"title": "夏天的西瓜", "level": "阅读短文（小学三四年级）", "text": "夏天最幸福的事情就是吃冰镇西瓜了。妈妈把西瓜切成一块一块的，放在冰箱里冰镇一会儿。\n拿出来的西瓜又甜又凉，咬一口，甜甜的汁水就流了出来，感觉暑气一下子就消退了不少。\n我和弟弟经常比赛谁吃得快，虽然每次都吃得满脸都是西瓜汁，但是我们都笑得很开心。夏天因为有西瓜，变得格外美好。"}, {"title": "我爱吃的水果", "level": "阅读短文（小学三四年级）", "text": "我最爱吃的水果是草莓，它红红的，形状像一颗心，咬一口，酸酸甜甜的味道让人回味无穷。\n每到春天，妈妈都会买很多草莓回来，我们一家人围在一起吃，一边吃一边聊天，特别温馨。\n老师说水果里有很多维生素，多吃水果对身体好。我以后要多尝试各种各样的水果，让自己更健康。\n妈妈还告诉我，不同季节吃当季的水果，味道最新鲜，营养也最丰富。"}, {"title": "一次搬家", "level": "阅读短文（小学三四年级）", "text": "上个月，我们家搬到了一个新的小区。搬家那天，家里到处都是纸箱，忙得不可开交。\n虽然舍不得原来的家，但是新家更宽敞明亮，我还拥有了一个属于自己的独立房间，特别兴奋。\n搬家后的第一个晚上，我躺在新房间里，看着陌生的天花板，心里既期待又有点不习惯，慢慢地进入了梦乡。\n渐渐地，我熟悉了新家的每一个角落，也交到了新的朋友，心里越来越喜欢这里。"}, {"title": "新邻居", "level": "阅读短文（小学三四年级）", "text": "我家隔壁最近搬来了一户新邻居，家里有个和我同岁的小女孩，我们很快就成了好朋友。\n她告诉我，她原来住在另一个城市，因为爸爸工作调动，所以搬到了我们这里，一开始有点不适应。\n我主动带她认识小区里的其他小朋友，还教她怎么去附近的公园玩。现在她已经完全适应了这里的生活。\n现在我们两家经常一起吃饭聊天，就像一家人一样，我很开心多了一个好朋友。"}, {"title": "我的小狗", "level": "阅读短文（小学三四年级）", "text": "我家养了一只小狗，名字叫豆豆，全身棕色的毛，摸起来软软的，非常可爱。\n每天放学回家，豆豆都会摇着尾巴跑过来迎接我，围着我转来转去，好像在说欢迎回家。\n晚上我写作业的时候，豆豆总是安静地趴在我脚边。有它陪伴，我觉得学习也变得不那么孤单了。\n每次看到豆豆开心地摇着尾巴，我一天的疲惫都会一下子消失得无影无踪。"}, {"title": "小兔子", "level": "阅读短文（小学三四年级）", "text": "邻居家养了两只小白兔，长长的耳朵，红红的眼睛，看起来十分乖巧可爱。\n我经常去邻居家看小兔子，还会带一些新鲜的胡萝卜和白菜叶去喂它们，它们吃东西的样子特别有趣。\n小兔子胆子很小，一有陌生的声音就会躲起来。邻居告诉我，要轻轻地靠近它们，才能获得它们的信任。\n邻居说，只要多花时间陪伴它们，小兔子也会慢慢和人变得亲近起来。"}, {"title": "金鱼缸", "level": "阅读短文（小学三四年级）", "text": "我家客厅里有一个金鱼缸，里面养了三条金鱼，红的、黑的、花的，颜色各不相同，非常好看。\n每天早上，我都会给金鱼喂食，看着它们争先恐后地游过来抢食物，样子十分可爱。\n有一次，一条金鱼生病了，浮在水面上不动。爸爸告诉我要换水，还教我以后要注意保持鱼缸的清洁。\n从那以后，我每周都会给鱼缸换水，金鱼们也都健健康康地游来游去。"}, {"title": "蚂蚁搬家", "level": "阅读短文（小学三四年级）", "text": "周末，我在小区的花园里看到一群蚂蚁在搬家。它们排成一条长长的队伍，井然有序地搬运食物。\n我蹲下来仔细观察，发现蚂蚁虽然身体很小，但是团结合作，能搬动比自己身体重很多倍的东西。\n我想起老师说过，团结就是力量。小小的蚂蚁用行动告诉了我这个道理，我觉得非常神奇。\n我把这次观察写进了作文里，老师夸我善于从生活中发现道理，我很开心。"}, {"title": "观察蜗牛", "level": "阅读短文（小学三四年级）", "text": "下雨后，我在花园里发现了一只蜗牛，它背着一个圆圆的壳，慢慢地在叶子上爬行。\n我蹲在旁边观察了很久，蜗牛爬过的地方留下一道亮晶晶的痕迹，好像是它自己画出来的路线图。\n我用手轻轻碰了一下它的触角，蜗牛立刻把身体缩进了壳里。原来它的壳就是它保护自己的家。\n原来大自然里到处都藏着值得我们细心观察的小秘密，真是太有趣了。"}, {"title": "我的植物角", "level": "阅读短文（小学三四年级）", "text": "科学课上，老师让我们在家里设置一个植物角，观察植物的生长过程。我在阳台上摆了几盆绿植。\n我每天都会给它们浇水，观察叶子的变化，还用小本子记录下每一株植物的成长情况。\n一个月后，我惊喜地发现其中一盆植物长出了新的叶子。看着自己精心照顾的植物茁壮成长，我特别有成就感。"}, {"title": "种向日葵", "level": "阅读短文（小学三四年级）", "text": "春天，我在花盆里种下了几颗向日葵的种子，每天都盼望着它们能快点发芽。\n大约一个星期后，泥土里终于冒出了嫩绿的小芽，我高兴得跳了起来，赶紧告诉妈妈这个好消息。\n经过几个月的悉心照料，向日葵越长越高，最后开出了金黄色的大花朵，跟着太阳转动，美丽极了。\n妈妈说，只要用心照顾，任何一颗小小的种子都能开出美丽的花朵。"}, {"title": "一次登山", "level": "阅读短文（小学三四年级）", "text": "假期里，爸爸带我去爬附近的一座小山。刚开始爬的时候，我兴致勃勃，脚步轻快。\n爬到半山腰，我开始觉得腿酸，有点想放弃，爸爸鼓励我说，坚持一下就能看到最美的风景。\n终于登上山顶，眼前的景色让我惊叹不已，整个城市都在脚下，我感到无比自豪，庆幸自己没有半途而废。\n回家后，我把这次登山的经历写进了日记，提醒自己遇到困难不要轻易放弃。"}, {"title": "去海边", "level": "阅读短文（小学三四年级）", "text": "暑假里，爸爸妈妈带我去了海边旅游。这是我第一次看到大海，那一望无际的蓝色让我十分震撼。\n我光着脚在沙滩上跑来跑去，捡了很多漂亮的贝壳。海浪一波一波地涌上来，冲刷着我的脚丫，凉凉的很舒服。\n傍晚，我们坐在沙滩上看日落，太阳慢慢地沉入海面，天空被染成了橙红色，美得像一幅画。"}, {"title": "去动物园", "level": "阅读短文（小学三四年级）", "text": "星期天，学校组织我们去动物园参观。一进大门，我就看到了一群憨态可掬的大熊猫，正在啃着竹子。\n我们还看到了长颈鹿、大象和老虎，每一种动物都让我大开眼界，感觉课本上的知识一下子活了起来。\n最有趣的是猴子表演，它们做出各种滑稽的动作，逗得大家哈哈大笑。这次动物园之行让我印象深刻。"}, {"title": "去游乐园", "level": "阅读短文（小学三四年级）", "text": "生日那天，爸爸妈妈带我去游乐园玩。一进门，我就被眼前五颜六色的游乐设施吸引住了。\n我先玩了旋转木马，接着又鼓起勇气坐了一次过山车，虽然一开始有点害怕，但是刺激极了。\n傍晚，我们看了一场精彩的烟花表演，五彩缤纷的烟花在夜空中绽放，为我的生日增添了美好的回忆。\n回家的路上，我一直回味着今天玩过的每一个项目，久久不能忘记。"}, {"title": "我的绘画本", "level": "阅读短文（小学三四年级）", "text": "我有一个专门用来画画的本子，里面记录了我这一年画的所有作品，有动物、风景，还有想象中的世界。\n每次心情不好的时候，我都会拿出画本，随便涂涂画画，慢慢地心情就会变得平静起来。\n妈妈说，我的画一年比一年进步，还把我最满意的几幅画装裱起来，挂在了客厅的墙上，我心里非常自豪。"}, {"title": "折纸", "level": "阅读短文（小学三四年级）", "text": "课外活动课上，老师教我们折纸鹤。老师一步一步地示范，我跟着认真地折，一开始总是折不好。\n经过反复练习，我终于成功折出了一只完整的纸鹤，翅膀展开的样子非常漂亮，我高兴极了。\n回家后，我教弟弟折纸鹤，虽然他折得歪歪扭扭的，但是我们都玩得很开心。折纸真是一种有趣的游戏。"}, {"title": "剪窗花", "level": "阅读短文（小学三四年级）", "text": "春节前，奶奶教我剪窗花。她先把红纸对折了好几次，然后用剪刀小心地剪出各种花纹和图案。\n我学着奶奶的样子，先画好图案，再沿着线条剪。虽然一开始剪得不太整齐，但是慢慢有了进步。\n把剪好的窗花贴在窗户上，红彤彤的一片，特别有过年的气氛。奶奶说这是我们中国的传统文化，要好好传承下去。"}, {"title": "制作贺卡", "level": "阅读短文（小学三四年级）", "text": "教师节快到了，我决定亲手制作一张贺卡送给老师。我拿出彩纸、剪刀和贴纸，认真地设计起来。\n我在贺卡上画了一朵向日葵，写上我想对老师说的祝福语，还贴上几个可爱的小贴纸装饰。\n把贺卡送给老师的那一刻，她的脸上露出了惊喜和感动的笑容。老师说这是她收到的最特别的礼物之一。\n从那以后，每年教师节，我都会亲手制作一张贺卡，表达自己对老师的感激之情。"}, {"title": "我的钢琴课", "level": "阅读短文（小学三四年级）", "text": "我从五岁开始学习弹钢琴，每个星期六都要去老师家上一节课。刚开始学的时候，手指总是不听使唤。\n经过几年的练习，我渐渐能弹出一些简单的乐曲了。虽然练琴有时候很枯燥，但是听到自己弹出美妙的音乐，就觉得一切都值得。\n上个月，我参加了学校的才艺表演，弹了一首练习了很久的曲子，台下响起了热烈的掌声，我特别自豪。"}, {"title": "学跳舞", "level": "阅读短文（小学三四年级）", "text": "我在学校的舞蹈社团学习跳舞，每周三放学后都会去社团教室练习基本功。\n舞蹈老师教我们压腿、下腰，动作很辛苦，有时候练完全身都酸痛。但是看到自己动作越来越标准，我很有成就感。\n上次学校的文艺汇演，我和同学们一起表演了一支集体舞，虽然紧张，但是表演结束后大家都欢呼起来，那种快乐无法用语言形容。"}, {"title": "我的合唱团", "level": "阅读短文（小学三四年级）", "text": "我加入了学校的合唱团，每周有两次排练时间。合唱团里有各个年级的同学，大家一起练习歌曲。\n音乐老师教我们怎样控制呼吸，怎样让声音更加和谐。刚开始我总是跟不上节奏，经过练习慢慢就熟练了。\n上次学校的六一晚会，我们合唱团表演了一首歌，声音整齐又动听，赢得了台下观众热烈的掌声。我为自己是合唱团的一员感到骄傲。"}, {"title": "拔河比赛", "level": "阅读短文（小学三四年级）", "text": "运动会上，我们班参加了拔河比赛。比赛之前，大家一起讨论了拔河的技巧，还练习了几次。\n比赛开始了，双方使出全身的力气，绳子在中间晃来晃去，谁也不肯让步，场面十分激烈。\n最后，在同学们的齐心协力下，我们班赢得了比赛。大家紧紧地拥抱在一起，为我们的团结和努力感到骄傲。\n这次比赛让我明白了，只要大家团结一心，就没有克服不了的困难。"}, {"title": "春游", "level": "阅读短文（小学三四年级）", "text": "春天到了，学校组织我们去公园春游。一路上，同学们又唱又跳，兴奋极了。\n公园里到处开满了鲜花，五颜六色，非常漂亮。我们在草地上铺开野餐垫，一起分享带来的零食和水果。\n下午，老师带我们做了几个团体游戏，大家玩得满头大汗，却依然笑声不断。这次春游让我度过了非常快乐的一天。"}, {"title": "秋游", "level": "阅读短文（小学三四年级）", "text": "秋天，学校组织我们去果园秋游。一进果园，就看到满树的苹果，红彤彤的，看着就让人流口水。\n农民伯伯教我们怎么摘苹果，我们小心翼翼地摘下一个个成熟的苹果，装进自己的小篮子里。\n回家的路上，我们一边吃着自己摘的苹果，一边聊着今天的收获，脸上都洋溢着满足的笑容。这次秋游让我体验到了丰收的快乐。"}, {"title": "元旦", "level": "阅读短文（小学三四年级）", "text": "元旦是新年的第一天，学校在这天举行了迎新联欢会。教室里挂满了彩带和气球，非常热闹。\n同学们轮流上台表演节目，有唱歌的，有跳舞的，还有讲笑话的，大家都笑得合不拢嘴。\n联欢会结束后，老师给每个同学都发了一颗糖果，祝我们新的一年学习进步。我期待着新一年会有更多美好的事情发生。"}, {"title": "儿童节", "level": "阅读短文（小学三四年级）", "text": "六一儿童节那天，学校举办了盛大的庆祝活动。操场上摆满了各种游戏摊位，充满了节日的气氛。\n我参加了套圈游戏和猜谜语活动，还赢得了一份小礼物，心里高兴极了。\n晚上，爸爸妈妈还带我去吃了我最喜欢的餐厅，度过了一个特别的儿童节。这一天，我感受到了满满的快乐和关爱。\n我在日记里写下这一天发生的一切，想把这份快乐永远地记录下来。"}, {"title": "端午节", "level": "阅读短文（小学三四年级）", "text": "端午节那天，奶奶一大早就开始包粽子。她把糯米和红枣包进粽叶里，然后用绳子仔细地捆好。\n我在旁边学着包，可是怎么也包不紧，糯米总是漏出来，逗得全家人哈哈大笑。\n粽子煮熟后，飘出阵阵清香，我迫不及待地剥开一个，甜甜糯糯的味道让人回味无穷。奶奶说，端午节吃粽子是为了纪念一位古代的诗人。"}, {"title": "重阳节", "level": "阅读短文（小学三四年级）", "text": "重阳节是尊敬老人的节日，这一天，我和爸爸妈妈一起去看望了年迈的爷爷奶奶。\n我给爷爷奶奶捶背、剥橘子，还给他们讲了学校里发生的有趣的事情，逗得他们开怀大笑。\n爷爷说，重阳节这天登高望远象征着长寿健康，于是我们一起去附近的小山上散步，度过了愉快而有意义的一天。\n临走前，爷爷奶奶一直把我们送到门口，脸上洋溢着幸福的笑容。"}, {"title": "我的作业本", "level": "阅读短文（小学三四年级）", "text": "我有好几本作业本，语文、数学、英语分开使用，每一本我都会认真书写，保持整洁。\n有一次我不小心把作业本弄脏了一页，心里很难受，怕老师批评。老师看到后却说，认真订正比外表整洁更重要。\n从那以后，我更加注意书写规范，每次做完作业都会仔细检查一遍。老师夸我的作业本越来越工整了，我心里很自豪。"}, {"title": "认真的同桌", "level": "阅读短文（小学三四年级）", "text": "我的同桌是一个学习非常认真的女孩，她上课从不走神，笔记记得又整齐又详细。\n每次遇到不会的题目，我都会请教她，她总是耐心地给我讲解，直到我完全弄明白为止。\n受她的影响，我也变得越来越认真了。老师说，好的同桌能带来好的影响，我很庆幸能有这样一位同桌。\n我也暗暗下定决心，以后要像她一样，做一个认真负责的学生。"}, {"title": "帮助新同学", "level": "阅读短文（小学三四年级）", "text": "这学期，我们班转来了一位新同学，她刚来的时候有点害羞，不太敢和大家说话。\n我主动走过去和她打招呼，带她认识班里的其他同学，还陪她一起熟悉学校的环境。\n渐渐地，她变得开朗起来，也交到了很多新朋友。她对我说，很感谢我第一天对她的帮助，我心里觉得特别温暖。\n老师说，一个班级就应该互相关心，我觉得这句话说得特别对。"}, {"title": "一次误会", "level": "阅读短文（小学三四年级）", "text": "有一天，我发现自己的铅笔不见了，怀疑是同桌拿走的，于是我生气地质问了他。\n同桌很委屈地说他没有拿，我们因此吵了一架，一整天都没有说话。回家后，我在书包夹层里找到了铅笔。\n第二天，我主动向同桌道歉，他原谅了我，我们又重新成为了好朋友。我明白了，遇到事情不能随便冤枉别人。"}, {"title": "我学会了道歉", "level": "阅读短文（小学三四年级）", "text": "上个星期，我因为一点小事和好朋友吵架了，还说了一些伤人的话，事后想想觉得很后悔。\n晚上，妈妈告诉我，做错事情不可怕，可怕的是不敢承认错误。她鼓励我主动去道歉。\n第二天，我鼓起勇气向朋友说了对不起，朋友也原谅了我，我们又和好如初。我明白了，真诚的道歉能修复友谊。\n从那以后，每次和朋友有了矛盾，我都会主动沟通，而不是把问题憋在心里。"}, {"title": "网络的利与弊", "level": "阅读短文（小学五六年级）", "text": "互联网给我们的学习和生活带来了极大的便利。通过网络，我们可以查阅资料、与远方的朋友交流，还能学习各种新知识。\n然而，网络也存在不少弊端。有些同学沉迷于网络游戏，影响了学习和视力；网上还存在着虚假信息，容易误导青少年。\n作为小学生，我们要合理使用网络，把它当作学习的工具，而不是娱乐的全部，这样才能真正发挥网络的价值。"}, {"title": "低碳生活", "level": "阅读短文（小学五六年级）", "text": "低碳生活是指在日常生活中尽量减少二氧化碳的排放，从而保护环境，减缓全球气候变暖的速度。\n低碳生活其实并不难做到。出门尽量步行或骑自行车，少开空调多开窗通风，随手关灯节约用电，都是低碳生活的具体表现。\n如果每个人都能从小事做起，坚持低碳的生活方式，我们的地球一定会变得更加美丽，我们的未来也会更加美好。"}, {"title": "保护森林", "level": "阅读短文（小学五六年级）", "text": "森林被称为地球之肺，它不仅能净化空气、涵养水源，还是无数动植物赖以生存的家园，对生态平衡起着至关重要的作用。\n然而，由于人类的过度砍伐，全球森林面积正在不断减少，这直接导致了水土流失、物种减少等一系列严重的环境问题。\n保护森林，人人有责。我们应当从自身做起，节约纸张，减少一次性木制品的使用，并积极参与植树造林活动，为地球增添一片绿色。"}, {"title": "节约用电", "level": "阅读短文（小学五六年级）", "text": "电力是现代生活不可缺少的能源，但发电往往需要消耗大量的煤炭等不可再生资源，还会产生一定的污染。\n节约用电，是每个公民都应尽的责任。随手关闭不用的电器，减少电器的待机时间，夏天空调温度不要调得太低，这些都是节电的好方法。\n学校也常常开展节能宣传活动，教育我们从小养成节约用电的好习惯。只有大家共同努力，才能让有限的能源发挥更大的价值。"}, {"title": "二十四节气", "level": "阅读短文（小学五六年级）", "text": "二十四节气是中国古代劳动人民根据太阳在黄道上的位置变化，总结出来的一套用于指导农业生产的历法知识。\n从立春到大寒，二十四节气准确地反映了季节、气温、降水等自然现象的变化规律，被誉为中国古代的第五大发明。\n如今，二十四节气不仅仍然指导着农业生产，也深深融入了中国人的日常生活，比如清明扫墓、冬至吃饺子，都是节气文化的体现。"}, {"title": "京剧艺术", "level": "阅读短文（小学五六年级）", "text": "京剧是中国的国粹之一，被称为东方歌剧，距今已经有二百多年的历史，是中华优秀传统文化的重要代表。\n京剧集唱、念、做、打于一体，演员通过精湛的表演技巧，塑造出生、旦、净、丑等各具特色的舞台人物形象。\n京剧的脸谱也十分讲究，不同的颜色代表不同的人物性格，比如红色代表忠诚，白色代表奸诈。了解京剧，就是了解一段厚重的中华文化。"}, {"title": "中国书法", "level": "阅读短文（小学五六年级）", "text": "书法是中国传统的艺术形式之一，是用毛笔书写汉字的艺术，讲究笔画的力度、结构的美感和整体的意境。\n中国书法有多种字体，如篆书、隶书、楷书、行书和草书，每一种字体都有其独特的美感和历史渊源，各具特色。\n学习书法，不仅能提高我们的审美能力，还能锻炼耐心和专注力。练字如做人，一笔一画都需要认真对待，这正是书法带给我们的启示。"}, {"title": "茶文化", "level": "阅读短文（小学五六年级）", "text": "中国是茶的故乡，饮茶的历史已经有几千年了。茶文化早已融入中国人的日常生活，成为待客交友的重要方式。\n中国茶的种类繁多，有绿茶、红茶、乌龙茶、白茶等，不同产地、不同工艺制作出的茶叶，风味各不相同，各有千秋。\n泡茶也是一门讲究的学问，水温、茶具、冲泡的时间都会影响茶的味道。品茶不仅是一种享受，更是一种修身养性的生活方式。"}, {"title": "汉字的演变", "level": "阅读短文（小学五六年级）", "text": "汉字是世界上历史最悠久的文字之一，从最初刻在龟甲兽骨上的甲骨文，到后来的金文、篆书、隶书，再到今天的楷书，经历了漫长的演变过程。\n汉字的演变过程，也反映了中华文明不断发展的历史进程。每一次字体的变化，都体现了当时社会的书写需求和审美追求。\n如今，汉字依然充满生命力，不仅在中国广泛使用，也影响着周边国家的文字系统。作为汉字的使用者，我们应当为这份古老的智慧感到自豪。"}, {"title": "春节习俗", "level": "阅读短文（小学五六年级）", "text": "春节是中华民族最隆重的传统节日，各地都有丰富多彩的习俗，体现了人们对新年美好生活的期盼。\n贴春联、放鞭炮、吃年夜饭、拜年、发红包，这些习俗代代相传，寄托着人们辞旧迎新、祈求平安幸福的美好愿望。\n虽然如今过节的方式随着时代不断变化，比如放鞭炮渐渐被电子鞭炮取代，但是春节所承载的团圆和祝福的文化内涵始终没有改变。"}, {"title": "元宵节", "level": "阅读短文（小学五六年级）", "text": "元宵节是农历正月十五，是春节之后的第一个重要节日，标志着新年庆祝活动的圆满结束。\n元宵节最重要的习俗是吃汤圆和赏花灯。圆圆的汤圆象征着团团圆圆，各式各样的花灯则寄托了人们对光明和幸福的向往。\n有些地方还会举行猜灯谜的活动，人们围在花灯下，绞尽脑汁地猜谜语，气氛热闹非凡，充满了节日的欢乐氛围。"}, {"title": "清明节", "level": "阅读短文（小学五六年级）", "text": "清明节是中国传统的祭祀节日，也是二十四节气之一，通常在每年四月初，这时候天气回暖，草木萌发，正是春意盎然的时节。\n清明节最重要的习俗是扫墓祭祖，人们会带上鲜花和祭品，前往祖先的墓地，表达对先人的怀念和敬意。\n除了扫墓，清明节还有踏青、插柳等习俗。人们借此机会走出家门，亲近自然，感受春天的生机与活力。"}, {"title": "端午节的由来", "level": "阅读短文（小学五六年级）", "text": "端午节是为了纪念战国时期楚国诗人屈原而设立的传统节日。相传屈原忧国忧民，投江自尽，百姓为了不让鱼虾伤害他的身体，纷纷划船打捞并投放粽子。\n从此，赛龙舟和吃粽子就成了端午节最具代表性的习俗，一直流传至今，成为中华民族独具特色的文化符号。\n端午节不仅是对历史人物的纪念，更承载着中华民族深厚的爱国情怀。每逢端午，我们都应铭记屈原忧国忧民的高尚品格。"}, {"title": "尊老爱幼", "level": "阅读短文（小学五六年级）", "text": "尊老爱幼是中华民族的传统美德，也是每个人应当具备的基本品质。尊敬长辈，关爱幼小，体现了一个人的教养和道德水平。\n在生活中，尊老爱幼可以体现在很多细节上：给老人让座，帮爷爷奶奶做家务，耐心地照顾比自己小的弟弟妹妹，这些都是尊老爱幼的具体表现。\n只有整个社会都重视尊老爱幼的传统，家庭才会更加温暖和睦，社会才会更加文明和谐。让我们从小事做起，把这份美德传承下去。"}, {"title": "集体的力量", "level": "阅读短文（小学五六年级）", "text": "一根筷子容易折断，一把筷子却很难折断，这句古老的谚语深刻地说明了集体力量的强大。个人的力量总是有限的，但集体的力量却能创造奇迹。\n在班级里，只要大家团结一心，共同努力，就能完成许多单靠一个人无法完成的任务，比如布置教室、组织活动、参加集体比赛。\n集体的力量来源于每一个成员的付出与配合。作为集体中的一员，我们每个人都应当承担起自己的责任，为集体的荣誉贡献自己的一份力量。"}, {"title": "竞争与合作", "level": "阅读短文（小学五六年级）", "text": "在现代社会中，竞争与合作是相辅相成的两个方面。适度的竞争能够激发人的潜能，促使我们不断进步；良好的合作则能够汇聚众人的智慧，实现共同的目标。\n在学习中，我们既要有竞争意识，努力争取更好的成绩，也要学会与同学合作，共同探讨问题，分享学习方法。\n真正优秀的人，往往懂得在竞争中保持风度，在合作中发挥所长。我们应当学会正确处理竞争与合作的关系，让自己变得更加优秀。"}, {"title": "阅读的乐趣", "level": "阅读短文（小学五六年级）", "text": "阅读是一件充满乐趣的事情，一本好书就像一位良师益友，能带给我们知识、智慧和快乐。\n通过阅读，我们可以跟随作者的文字，去到从未去过的地方，认识形形色色的人物，体验各种各样的人生经历，极大地开阔了我们的视野。\n每当我沉浸在一本好书中，时间仿佛都变慢了。我常常在阅读中忘记烦恼，收获宁静和满足。阅读的乐趣，是任何其他事情都无法替代的。"}, {"title": "旅行的意义", "level": "阅读短文（小学五六年级）", "text": "旅行不仅仅是欣赏美丽的风景，更是一次开阔眼界、增长见识的宝贵机会。走出熟悉的环境，我们能接触到不同的文化和生活方式。\n在旅行中，我们会遇到形形色色的人，看到千姿百态的风土人情，这些经历往往比课本上的知识更加生动和深刻，让人终生难忘。\n古人说，读万卷书，行万里路。旅行让我们把书本上学到的知识与真实的世界联系起来，从而对这个世界有了更加立体和全面的理解。"}, {"title": "珍惜时间", "level": "阅读短文（小学五六年级）", "text": "时间是世界上最公平的东西，它对每个人都是一样的，一天二十四小时，一刻也不会多，一刻也不会少，谁也无法留住它的脚步。\n然而，有些人却常常虚度光阴，把大好时光浪费在无意义的事情上；而有些人却懂得珍惜时间，把每一分每一秒都用在有意义的事情上。\n少壮不努力，老大徒伤悲。作为学生，我们应当从现在开始，合理安排时间，认真学习，不虚度这段最宝贵的青春年华。"}, {"title": "自信的重要性", "level": "阅读短文（小学五六年级）", "text": "自信是一个人取得成功的重要品质。一个自信的人，往往能够在困难面前保持坚定的信念，勇敢地迎接各种挑战。\n缺乏自信的人，即使有能力，也可能因为害怕失败而不敢尝试，最终错失了许多本可以把握的机会。\n培养自信心，需要不断地积累成功的经验，也需要正确地看待失败，从失败中总结经验教训。相信自己，是通往成功道路上不可缺少的力量。"}, {"title": "换位思考", "level": "阅读短文（小学五六年级）", "text": "换位思考是指站在别人的角度去理解和体会对方的想法和感受，这是一种重要的处世智慧，也是人际交往中不可缺少的能力。\n在与同学发生矛盾的时候，如果我们能够多站在对方的角度想一想，也许就能理解对方的难处，从而更容易化解矛盾，重归于好。\n学会换位思考，不仅能减少人与人之间的误解和冲突，还能让我们变得更加宽容和善解人意，收获更多真挚的友谊。"}, {"title": "感恩的心", "level": "阅读短文（小学五六年级）", "text": "感恩是一种美好的品德，是对他人给予的帮助和关爱表示由衷的感激。父母的养育、老师的教导、朋友的帮助，都值得我们心怀感恩。\n拥有一颗感恩的心，能让我们更加珍惜身边的人和事，也能让我们的生活充满温暖和幸福，而不是抱怨和埋怨。\n表达感恩其实并不难，一句真诚的谢谢，一次力所能及的帮助，都是感恩的体现。让我们从生活中的小事做起，学会感恩，传递温暖。"}, {"title": "责任心", "level": "阅读短文（小学五六年级）", "text": "责任心是一个人做人做事的基本准则，指的是一个人对自己所承担的事情认真负责的态度，是一种十分重要的品质。\n在学校里，认真完成作业、遵守班级纪律，是学生责任心的体现；在家里，主动分担家务、照顾家人，是家庭责任心的体现。\n拥有责任心的人，往往能够获得他人的信任，也更容易在学习和生活中取得成就。从小培养责任心，是我们成长道路上必不可少的一课。"}, {"title": "中国的四季", "level": "阅读短文（小学五六年级）", "text": "中国幅员辽阔，地跨多个气候带，四季分明的特点在大部分地区都十分明显，春夏秋冬各有各的独特景色。\n春天万物复苏，百花盛开；夏天骄阳似火，绿意盎然；秋天层林尽染，硕果累累；冬天银装素裹，宁静祥和。\n四季的更替，不仅塑造了丰富多样的自然景观，也孕育了中国人顺应自然、天人合一的生活智慧和文化传统，值得我们细细品味。"}, {"title": "家乡的变化", "level": "阅读短文（小学五六年级）", "text": "近年来，我的家乡发生了翻天覆地的变化。以前坑坑洼洼的土路，如今都变成了宽阔平坦的柏油马路，出行变得十分便利。\n家乡新建了不少高楼大厦，还建起了漂亮的公园和图书馆，人们的生活水平和精神面貌都有了显著的提高。\n每次听爷爷讲起过去家乡的样子，我都为今天的巨大变化感到骄傲。相信随着时间的推移，我的家乡一定会变得更加美好。"}, {"title": "时间管理", "level": "阅读短文（初中一年级）", "text": "进入初中后，学习科目增多，课业负担加重，如何合理安排时间，成为每个初中生都要面对的课题。\n有效的时间管理，首先要学会制定计划，明确每天、每周的学习任务和优先顺序；其次要避免拖延，把大任务分解成小步骤逐一完成。\n合理的时间管理不仅能提高学习效率，还能留出时间用于运动、休息和兴趣爱好，让学习和生活达到一种健康的平衡状态。"}, {"title": "情绪管理", "level": "阅读短文（初中一年级）", "text": "进入青春期后，我们的情绪往往变得更加敏感和强烈，喜怒哀乐的波动也比以前更加明显，这是身心发展的正常现象。\n学会管理情绪，并不意味着压抑自己的感受，而是要学会认识和接纳情绪，并用恰当的方式表达和排解，比如运动、倾诉或写日记。\n当情绪失控时，我们可以尝试深呼吸，让自己冷静下来，再思考解决问题的方法。良好的情绪管理能力，是我们健康成长的重要基础。"}, {"title": "自律的重要性", "level": "阅读短文（初中一年级）", "text": "自律，是指一个人能够自觉地约束自己的行为，按照既定的目标和规则行事，而不需要依靠外部的监督和强制。\n自律的人往往能够抵御眼前的诱惑，坚持长远的目标。比如按时完成作业而不是先玩手机，坚持锻炼而不是找借口偷懒。\n培养自律能力需要一个循序渐进的过程，可以从制定小目标开始，逐步养成习惯。自律看似是一种约束，实际上却是通往自由和成功的必经之路。"}, {"title": "团队合作精神", "level": "阅读短文（初中一年级）", "text": "在现代社会，无论是学习、工作还是生活，单打独斗往往难以取得理想的效果，团队合作精神显得尤为重要。\n一个优秀的团队，需要成员之间明确分工、有效沟通、相互信任，才能发挥出一加一大于二的效果，共同完成既定的目标。\n在学校的小组作业和社会实践活动中，我们应当积极培养团队合作的意识，学会倾听他人的意见，也学会表达自己的观点，共同进步。"}, {"title": "沟通的艺术", "level": "阅读短文（初中一年级）", "text": "沟通是人与人之间传递信息、交流情感的重要方式，良好的沟通能力，是一个人立足社会不可缺少的软实力。\n有效的沟通，不仅仅是清楚地表达自己的想法，更重要的是认真倾听对方的意见，理解对方的立场，并给予恰当的回应。\n在与父母、老师、同学的日常交流中，我们应当学会尊重不同的观点，用平和的语气表达自己，避免因为言语冲突而产生不必要的矛盾。"}, {"title": "全球化的影响", "level": "阅读短文（初中一年级）", "text": "随着交通和通信技术的飞速发展，世界各国之间的联系日益紧密，全球化已经成为不可逆转的时代趋势，深刻影响着我们的生活。\n全球化带来了商品、技术和文化的广泛交流，让我们能够品尝到世界各地的美食，接触到不同国家的文化和思想，极大地丰富了我们的生活。\n然而，全球化也带来了一些挑战，比如本土文化受到冲击、国际竞争日益激烈。作为新时代的青少年，我们既要拥抱世界，也要坚守自己的文化根基。"}, {"title": "人工智能的发展", "level": "阅读短文（初中一年级）", "text": "近年来，人工智能技术取得了突飞猛进的发展，从智能手机中的语音助手，到能够辅助医生诊断疾病的系统，人工智能已经悄然融入了我们生活的方方面面。\n人工智能的发展，一方面极大地提高了生产效率，为人类解决了许多复杂的问题；另一方面，也引发了关于就业、隐私和伦理等方面的广泛讨论。\n面对人工智能带来的机遇与挑战，我们应当以开放的心态学习新知识，同时也要保持理性思考，正确认识和使用这项日新月异的技术。"}, {"title": "科技与生活", "level": "阅读短文（初中一年级）", "text": "科技的进步极大地改变了人类的生活方式。从蒸汽机到互联网，每一次科技革命都深刻地重塑了人类社会的面貌。\n如今，智能手机、移动支付、共享出行等科技产物，已经深入我们生活的每一个角落，让人们的生活变得更加便捷高效。\n然而，科技是一把双刃剑，在享受科技带来便利的同时，我们也应当警惕过度依赖科技可能带来的负面影响，比如缺乏面对面的交流和运动不足等问题。"}, {"title": "城市化进程", "level": "阅读短文（初中一年级）", "text": "城市化是指农村人口向城市转移、城市规模不断扩大的社会经济发展过程，是现代社会发展的一个重要标志。\n城市化为人们提供了更多的就业机会和更完善的公共服务，比如更好的教育资源、医疗条件和交通设施，吸引了大量人口涌入城市。\n然而，城市化过程中也出现了交通拥堵、环境污染、住房紧张等一系列问题。如何实现城市的可持续发展，是当今社会需要共同面对的重要课题。"}, {"title": "消费观念", "level": "阅读短文（初中一年级）", "text": "随着经济的发展和生活水平的提高，人们的消费观念也在不断发生变化，从过去的节俭型消费逐渐向多元化的消费方式转变。\n作为青少年，我们正处在消费观念形成的重要时期，应当树立理性消费的意识，不盲目攀比，不追求名牌，量入为出，避免不必要的浪费。\n合理的消费观念，不仅有助于我们养成良好的理财习惯，更能帮助我们树立正确的价值观，明白物质并非衡量幸福的唯一标准。"}, {"title": "媒体素养", "level": "阅读短文（初中一年级）", "text": "在信息高度发达的今天，我们每天都会接触到来自电视、网络、社交媒体等各种渠道的海量信息，媒体素养的重要性日益凸显。\n媒体素养是指能够正确理解、辨别和运用媒体信息的能力，包括判断信息的真实性、认识媒体报道背后的立场和目的等。\n作为青少年，我们应当学会理性地看待媒体信息，不轻信谣言，不盲目转发未经证实的消息，培养独立思考和批判性分析的能力。"}, {"title": "环境保护的责任", "level": "阅读短文（初中一年级）", "text": "环境是人类赖以生存的基础，保护环境不仅关乎当代人的生活质量，更关系到子孙后代的长远发展，是每一个公民义不容辞的责任。\n近年来，空气污染、水资源短缺、垃圾处理等环境问题日益严峻，这些问题的产生，很大程度上源于人类对自然资源的过度索取和不合理利用。\n保护环境需要从日常小事做起，比如节约用水用电、绿色出行、垃圾分类。只有每个人都承担起自己的一份责任，才能守护好我们共同的家园。"}, {"title": "气候变化", "level": "阅读短文（初中一年级）", "text": "气候变化是当今世界面临的最严峻的全球性挑战之一。由于人类活动排放的温室气体不断增加，全球气温呈现出持续上升的趋势。\n气候变化带来的影响是多方面的：极端天气事件频发、海平面上升、生态系统失衡，这些问题正在威胁着人类和无数物种的生存环境。\n应对气候变化，需要世界各国携手合作，共同减少碳排放，推广清洁能源。作为个人，我们也应当从节约能源做起，为减缓气候变化贡献自己的力量。"}, {"title": "传统与创新", "level": "阅读短文（初中一年级）", "text": "传统与创新，看似是一对矛盾的概念，实际上却是相辅相成的关系。传统是历史的积淀，是文化的根基；创新则是发展的动力，是时代的要求。\n在快速发展的现代社会，如果一味守旧，固守传统而不知变通，就容易被时代淘汰；但如果完全抛弃传统，一味求新求变，又会失去文化的根基和身份认同。\n真正明智的做法，是在继承优秀传统的基础上，结合时代的特点进行创新，让传统文化焕发出新的生命力，实现古为今用、推陈出新。"}, {"title": "个人隐私保护", "level": "阅读短文（初中一年级）", "text": "在信息化时代，个人隐私保护变得尤为重要。我们的姓名、住址、照片等个人信息，一旦泄露，就可能被不法分子利用，造成严重的后果。\n随着社交媒体和各种应用程序的普及，很多人在不知不觉中就泄露了大量个人信息，比如随意在网上晒出自己的行程、地址等。\n保护个人隐私，需要提高警惕，不轻易在网络上透露真实的个人信息，谨慎使用陌生的应用程序，同时也要学会用法律武器维护自己的合法权益。"}, {"title": "社会公平", "level": "阅读短文（初中一年级）", "text": "社会公平是指社会成员在权利、机会和资源分配等方面享有平等的待遇，是衡量一个社会文明程度的重要标准之一。\n实现社会公平，需要建立健全的法律制度，保障每个人的基本权利，同时也要通过教育、就业等方面的政策，缩小社会成员之间的差距。\n作为社会的一员，我们应当树立正确的公平意识，尊重每一个人的平等权利，反对任何形式的歧视，共同营造一个更加公正和谐的社会环境。"}, {"title": "家庭教育的意义", "level": "阅读短文（初中一年级）", "text": "家庭是人生的第一所学校，父母是孩子的第一任老师。家庭教育对一个人价值观和性格的形成，具有深远而重要的影响。\n良好的家庭教育，不仅仅是传授知识，更重要的是培养孩子健全的人格、良好的习惯和正确的价值观，为孩子的一生发展奠定坚实的基础。\n作为子女，我们也应当理解父母的良苦用心，主动与父母沟通，共同营造一个和谐温暖的家庭氛围，让家庭教育发挥出最大的积极作用。"}, {"title": "挫折教育", "level": "阅读短文（初中一年级）", "text": "挫折教育是指通过让孩子适度经历挫折和困难，培养他们面对困境时的心理承受能力和解决问题的能力，是成长过程中不可缺少的一环。\n现在的许多孩子从小生活条件优越，很少经历真正的挫折，一旦遇到困难就容易感到无助和沮丧，甚至一蹶不振。\n适当的挫折教育，能够帮助我们建立更加坚韧的心理素质，学会正确面对失败，从失败中总结经验教训，从而更好地迎接未来的各种挑战。"}, {"title": "独立思考的能力", "level": "阅读短文（初中一年级）", "text": "独立思考，是指一个人能够依靠自己的理性分析和判断，形成自己的观点，而不是盲目附和他人的意见或随波逐流。\n在信息爆炸的时代，各种观点和声音层出不穷，如果缺乏独立思考的能力，就很容易被表面的信息所迷惑，人云亦云，失去自己的判断力。\n培养独立思考的能力，需要广泛阅读，积累知识，同时也要敢于质疑，勇于提出自己的见解。这是我们在纷繁复杂的世界中保持清醒的重要保障。"}, {"title": "目标与规划", "level": "阅读短文（初中一年级）", "text": "明确的目标和合理的规划，是一个人取得成功的重要前提。没有目标的努力，就像没有方向的航行，很难到达理想的彼岸。\n设定目标时，我们既要有远大的理想，也要有切合实际的短期目标，把大目标分解成一个个可以实现的小目标，逐步向前推进。\n在实现目标的过程中，难免会遇到各种困难和挫折，这时候就需要我们坚定信念，及时调整规划，坚持不懈地朝着目标努力前进。"}, {"title": "同伴关系", "level": "阅读短文（初中一年级）", "text": "进入青春期后，同伴关系在我们的生活中变得越来越重要，很多时候，同伴的意见甚至比父母老师的话更能影响我们的想法和行为。\n良好的同伴关系，能够给我们带来情感上的支持和理解，让我们在成长的过程中不再感到孤单，也能从同伴身上学到许多有益的经验。\n但我们也应当理性看待同伴的影响，学会分辨是非，坚持自己正确的原则，不盲目从众，避免受到不良同伴的负面影响，健康快乐地成长。"}, {"title": "自我认知", "level": "阅读短文（初中一年级）", "text": "自我认知，是指一个人对自己的性格、能力、优点和不足等方面的了解和认识，是个人成长和发展的重要基础。\n准确的自我认知，能够帮助我们更加清楚地认识自己适合做什么、擅长什么，从而在学习和未来的职业选择上做出更加明智的决定。\n提升自我认知，可以通过反思自己的行为和感受，倾听他人客观的评价，以及不断尝试新的事物来实现。认识自己，是每个人一生的必修课。"}, {"title": "中华饮食文化", "level": "阅读短文（初中一年级）", "text": "中华饮食文化历史悠久，博大精深，是中华优秀传统文化的重要组成部分。中国菜讲究色、香、味、形俱全，不同地域还形成了各具特色的八大菜系。\n中华饮食不仅注重味觉上的享受，更蕴含着深厚的文化内涵，比如年夜饭象征团圆，长寿面寓意健康长寿，处处体现着中国人对美好生活的向往。\n随着时代的发展，中华饮食文化也在不断创新和发展，同时也走向了世界，让越来越多的外国朋友通过中国美食，了解和喜爱上了中华文化。"}, {"title": "中国戏曲艺术", "level": "阅读短文（初中一年级）", "text": "中国戏曲是一种融合了文学、音乐、舞蹈、美术等多种艺术形式的综合性表演艺术，历史悠久，种类繁多，据统计全国共有三百多个戏曲剧种。\n除了广为人知的京剧，各地还有许多具有浓郁地方特色的戏曲，比如越剧、豫剧、黄梅戏等，它们用不同的方言和唱腔，讲述着各地的历史故事和民间传说。\n随着娱乐方式的多样化，戏曲艺术的传承也面临一定的挑战。保护和传承这份珍贵的文化遗产，需要我们年轻一代给予更多的关注和支持。"}, {"title": "语言的魅力", "level": "阅读短文（初中一年级）", "text": "语言不仅是人类交流思想、传递信息的工具，更是承载着一个民族历史文化和思维方式的重要载体，蕴含着独特而丰富的魅力。\n汉语作为世界上使用人数最多的语言之一，拥有独特的音韵美、意境美和形式美，一首简短的古诗，往往就能表达出极为丰富的意境和情感。\n学习和掌握多种语言，不仅能够帮助我们更好地与世界沟通交流，还能够拓展我们的思维方式，让我们从不同的文化视角去理解这个丰富多彩的世界。"}, {"title": "阅读与写作", "level": "阅读短文（初中一年级）", "text": "阅读与写作是相辅相成的两种能力，广泛的阅读能够为写作提供丰富的素材和灵感，而坚持写作又能反过来加深我们对阅读内容的理解和思考。\n阅读优秀的作品，能够让我们学习到精妙的语言表达和巧妙的构思方法，潜移默化地提高我们自身的写作水平和文学修养。\n坚持写作，需要我们勤于观察生活，善于捕捉细节，并且不断练习，把自己的所见所闻所感，用文字准确而生动地表达出来，这是一个长期积累的过程。"}, {"title": "体育精神", "level": "阅读短文（初中一年级）", "text": "体育不仅仅是强身健体的手段，更是一种精神的体现，蕴含着公平竞争、永不放弃、团结协作等宝贵的价值理念。\n在体育比赛中，胜利固然令人欣喜，但真正的体育精神，体现在遵守规则、尊重对手、无论输赢都能保持良好心态的过程中。\n通过参与体育运动，我们不仅能够锻炼强健的体魄，更能培养坚韧不拔的意志品质，这种精神对我们今后面对学习和生活中的各种挑战都大有裨益。"}, {"title": "探索精神", "level": "阅读短文（初中一年级）", "text": "探索精神是人类文明不断进步的重要动力，正是因为一代又一代人对未知世界的好奇和探索，才推动了科学技术的飞速发展。\n从哥伦布远航发现新大陆，到人类登上月球，再到如今对深海、太空的持续探索，每一次伟大的发现，都源于人类不畏艰险、勇于探索的精神。\n作为新时代的青少年，我们应当保持对世界的好奇心，勇于质疑，敢于尝试新的事物，把这种探索精神融入到日常的学习和生活中去。"}, {"title": "敬业精神", "level": "阅读短文（初中一年级）", "text": "敬业精神，是指一个人对自己所从事的工作认真负责、精益求精的态度，是每一个行业、每一位从业者都应当具备的基本职业素养。\n拥有敬业精神的人，无论从事什么样的工作，都会全力以赴，努力把每一件事情做到最好，这种态度往往也是获得他人尊重和事业成功的重要原因。\n虽然我们还是学生，但也可以在日常的学习和班级工作中培养敬业精神，比如认真完成每一项作业，负责任地履行班级职务，为将来走向社会打下良好的基础。"}];
let readingHistory = [];
let readingIdx = -1;

function generateReading() {
  const box = document.getElementById('readingContent');
  const random = PASSAGES[Math.floor(Math.random() * PASSAGES.length)];

  readingHistory.push(random);
  readingIdx = readingHistory.length - 1;

  renderReading(random);
  updateReadingBtns();
}

function renderReading(data) {
  const box = document.getElementById('readingContent');
  box.innerHTML = `
    <div class="reading-title">${data.title}</div>
    <div class="reading-level">${data.level}</div>
    <div class="reading-text">${data.text.replace(/\n/g, '<br>')}</div>
  `;
}

function readingPrev() {
  if (readingIdx > 0) {
    readingIdx--;
    renderReading(readingHistory[readingIdx]);
    updateReadingBtns();
  }
}

function readingNext() {
  if (readingIdx < readingHistory.length - 1) {
    readingIdx++;
    renderReading(readingHistory[readingIdx]);
    updateReadingBtns();
  }
}

function updateReadingBtns() {
  document.getElementById('readingPrevBtn').disabled = readingIdx <= 0;
  document.getElementById('readingNextBtn').disabled = readingIdx >= readingHistory.length - 1;
}

// ── 앱 모드 전환 ─────────────────────────────────────────────
function switchApp(mode, btn) {
  document.querySelectorAll('.app-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  // 모두 숨기기
  document.getElementById('listeningSection').style.display = 'none';
  document.getElementById('listenTabs').style.display = 'none';
  document.getElementById('levelTabs').style.display = 'none';
  document.getElementById('readingSection').style.display = 'none';
  document.querySelectorAll('.progress-bar, .progress-text, .card-area, .nav-btns, .shuffle-btn, #doneScreen').forEach(el => el.style.display = 'none');

  if (mode === 'flashcard') {
    document.getElementById('levelTabs').style.display = 'flex';
    document.querySelectorAll('.progress-bar, .progress-text, .card-area, .nav-btns, .shuffle-btn, #doneScreen').forEach(el => el.style.display = '');
  } else if (mode === 'listening') {
    document.getElementById('listeningSection').style.display = 'flex';
    document.getElementById('listenTabs').style.display = 'flex';
    document.querySelectorAll('#listenTabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelector('#listenTabs .tab[data-level="' + listenLevel + '"]').classList.add('active');
    loadAudioFiles(listenLevel);
  } else if (mode === 'reading') {
    document.getElementById('readingSection').style.display = 'flex';
    if (readingHistory.length === 0) generateReading();
  }
}

// ── 듣기연습 로직 ─────────────────────────────────────────────
const REPO = 'crazywave3/HSK_voca';
const BRANCH = 'main';
let listenLevel = 'hsk3';
let audioEl = new Audio();
let isPlaying = false;
let currentFile = null;

function setListenLevel(level, btn) {
  listenLevel = level;
  document.querySelectorAll('#listenTabs .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  loadAudioFiles(level);
  // 현재 재생 중이면 정지
  audioEl.pause();
  isPlaying = false;
  document.getElementById('playBtn').textContent = '▶ 재생';
  document.getElementById('playerBox').style.display = 'none';
  currentFile = null;
}

async function loadAudioFiles(level) {
  const listEl = document.getElementById('fileList');
  listEl.innerHTML = '<div class="no-files">파일을 불러오는 중...</div>';
  try {
    const url = `https://api.github.com/repos/${REPO}/contents/audio/${level}?ref=${BRANCH}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
    if (!res.ok) throw new Error('API 오류');
    const files = await res.json();
    const mp3s = files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
    if (mp3s.length === 0) {
      listEl.innerHTML = '<div class="no-files">등록된 파일이 없습니다.</div>';
      return;
    }
    listEl.innerHTML = '';
    mp3s.forEach(file => {
      const btn = document.createElement('button');
      btn.className = 'file-item';
      btn.innerHTML = `<span class="file-icon">🎧</span><span class="file-name">${file.name.replace('.mp3','').replace(/_/g,' ')}</span>`;
      btn.onclick = () => playFile(file, btn);
      listEl.appendChild(btn);
    });
  } catch(e) {
    listEl.innerHTML = '<div class="no-files">파일 목록을 불러오지 못했습니다.</div>';
  }
}

function playFile(file, btnEl) {
  // 선택 표시
  document.querySelectorAll('.file-item').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  currentFile = file;
  // 플레이어 표시
  const box = document.getElementById('playerBox');
  box.style.display = 'block';
  document.getElementById('playerTitle').textContent = file.name.replace('.mp3','').replace(/_/g,' ');
  // 오디오 로드
  audioEl.pause();
  audioEl.src = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/audio/${listenLevel}/${encodeURIComponent(file.name)}`;
  audioEl.load();
  isPlaying = false;
  document.getElementById('playBtn').textContent = '▶ 재생';
  document.getElementById('playerBarFill').style.width = '0%';
  document.getElementById('playerCurrent').textContent = '0:00';
  document.getElementById('playerDuration').textContent = '0:00';
  // 진행 바 업데이트
  audioEl.ontimeupdate = updateProgress;
  audioEl.onloadedmetadata = () => {
    document.getElementById('playerDuration').textContent = formatTime(audioEl.duration);
  };
  audioEl.onended = () => {
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶ 재생';
  };
}

function togglePlay() {
  if (!currentFile) return;
  if (isPlaying) {
    audioEl.pause();
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶ 재생';
  } else {
    audioEl.play();
    isPlaying = true;
    document.getElementById('playBtn').textContent = '■ 멈춤';
  }
}

function skipAudio(sec) {
  if (!currentFile) return;
  audioEl.currentTime = Math.max(0, Math.min(audioEl.duration || 0, audioEl.currentTime + sec));
}

function seekAudio(e) {
  if (!currentFile || !audioEl.duration) return;
  const wrap = document.getElementById('playerBarWrap');
  const rect = wrap.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audioEl.currentTime = ratio * audioEl.duration;
}

// 드래그 기능
let isDragging = false;
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.getElementById('playerBarWrap');
  if (!wrap) return;
  wrap.addEventListener('mousedown', (e) => {
    isDragging = true;
    seekAudio(e);
  });
  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    seekAudio(e);
  });
  document.addEventListener('mouseup', () => { isDragging = false; });
  // 모바일 터치
  wrap.addEventListener('touchstart', (e) => {
    isDragging = true;
    e.preventDefault();
    seekAudio(e.touches[0]);
  }, {passive: false});
  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    seekAudio(e.touches[0]);
  }, {passive: false});
  document.addEventListener('touchend', () => { isDragging = false; });
});

function updateProgress() {
  if (!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  document.getElementById('playerBarFill').style.width = pct + '%';
  document.getElementById('playerCurrent').textContent = formatTime(audioEl.currentTime);
}

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function setLevel(l, btn) {
  level = l;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector(`.tab[data-level="${l}"]`).classList.add('active');
  deck = [...RAW[l]];
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  idx = 0; isShuffled = true;
  showCard();
  document.getElementById('doneScreen').style.display = 'none';
  document.getElementById('cardArea').style.display = 'block';
  document.querySelectorAll('.nav-btns button, .shuffle-btn').forEach(b => b.style.display = '');
  document.querySelector('.progress-bar').style.display = '';
  document.querySelector('.progress-text').style.display = '';
}
function showCard() {
  cardState = 0;
  const inner = document.getElementById('cardInner');
  inner.style.transition = 'none';
  inner.classList.remove('flipped');
  inner.style.visibility = 'visible';
  document.getElementById('cardDetail').style.display = 'none';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { inner.style.transition = ''; });
  });
  const card = deck[idx];
  document.getElementById('cardFront').textContent = card.front;
  document.getElementById('cardBackHanzi').textContent = card.front;
  document.getElementById('cardBackPinyin').textContent = parsePinyin(card.back);
  // 예문 랜덤 선택
  currentExIdx = Math.floor(Math.random() * card.examples.length);
  document.getElementById('cardExample').textContent = card.examples[currentExIdx].sentence;
  const pct = Math.round((idx + 1) / deck.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${idx + 1} / ${deck.length}`;
}

function copyExample(e) {
  e.stopPropagation();
  const text = document.getElementById('cardExample').textContent;
  if (!text) return;
  const el = document.getElementById('cardExample');
  navigator.clipboard.writeText(text)
    .then(() => {
      el.style.color = '#2e75b6';
      setTimeout(() => { el.style.color = ''; }, 600);
    })
    .catch(() => {
      // clipboard 미지원 환경 대비 fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      el.style.color = '#2e75b6';
      setTimeout(() => { el.style.color = ''; }, 600);
    });
}
function nextCard() {
  if (idx < deck.length - 1) { idx++; showCard(); } else showDone();
}
function prevCard() {
  if (idx > 0) { idx--; showCard(); }
}
function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0; isShuffled = true; showCard();
}
function showDone() {
  document.getElementById('cardArea').style.display = 'none';
  document.querySelectorAll('.nav-btns button, .shuffle-btn').forEach(b => b.style.display = 'none');
  document.querySelector('.progress-bar').style.display = 'none';
  document.querySelector('.progress-text').style.display = 'none';
  const names = {hsk1:'HSK 1급', hsk2:'HSK 2급', hsk3:'HSK 3급'};
  document.getElementById('doneText').textContent = `${names[level]} 단어 ${deck.length}개를 모두 학습했습니다!`;
  document.getElementById('doneScreen').style.display = 'flex';
}
function restart() {
  deck = [...RAW[level]]; idx = 0; isShuffled = false;
  document.getElementById('doneScreen').style.display = 'none';
  document.getElementById('cardArea').style.display = 'block';
  document.querySelectorAll('.nav-btns button, .shuffle-btn').forEach(b => b.style.display = '');
  document.querySelector('.progress-bar').style.display = '';
  document.querySelector('.progress-text').style.display = '';
  showCard();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === ' ') { e.preventDefault(); handleCardClick(); }
});
let touchX = 0;
document.getElementById('cardArea').addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
}, {passive: true});
document.getElementById('cardArea').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) { if (dx < 0) nextCard(); else prevCard(); }
}, {passive: true});
setLevel('hsk3', document.querySelector('#levelTabs .tab[data-level="hsk3"]'));
</script>
</body>
</html>
